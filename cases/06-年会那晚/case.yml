      22:47  页数 11  来源 10.20.12.37（12 层工位网段）  提交人：未登录（本机直连）
      22:47  页数 11  状态：已完成
    supports: "22:47 有人从 12 层的工位网段直接打了 11 页，而「未登录、本机直连」说明是走到打印机跟前接的 USB。22:47 在楼上的是两个人：吴敏（22:20 从正门上来，前台登记上有她的签字，她在位这件事是公开的）与邵川（22:41 从消防通道上来，那是隐的）。**而这 11 页只有邵川有理由打** —— 那是他自己整理的、改过的记录，准备放回档案位换掉真件（真件已经在碎纸机里了，见 c3 纸角）—— 这是动机独占，不是物证指向。"
  - id: c3
    title: 消防通道里的东西
    text: |
      12 层消防通道 · 现场（次日早晨）

      楼梯转角地面上：一根深蓝色的工牌挂绳，带卡套，**卡不在里面**。
      挂绳末端有撕裂痕迹，是拉断的。
      **卡套内侧贴着一张姓名条：「技术中心 邵川」。**

      同一次巡检：碎纸机纸篓里翻出一角没碎干净的纸，边缘露出半行数字：
        「并发 800 持续 90s → 失败」

      另：邵川本人当天到公司时，脖子上没有挂绳，工牌揣在外套口袋里。
      那张卡的编号与门禁记录里 22:41 刷卡的那一张一致。
    supports: "**这一条是这个本子的硬证据**，因为它把「卡」和「人」绑在一起了：挂绳是拉断的（争执里扯的），卡套上写着他的名字，而那张卡当天就在他身上——编号与 22:41 刷卡记录一致。所以「卡借给别人了」这个说法不成立：卡没借出去，它一直在他身上，而 22:41 刷的就是它。他唯一能说的是「我的挂绳被人扯走了」，可那样卡也该一起不见，而卡在他口袋里。纸角上那半行是压测原始结果：并发 800 就失败，而报给客户的报告写的是 2000 无压力。"
  - id: c4
    title: 那份报给客户的报告
    text: |
      项目验收材料（下周三待交）

      压测章节：单机 2000 并发，无压力，响应均值 82ms
      编制：邵川
      审核：韩松
    supports: "签字的是邵川，拍板的是韩松。所以照看那份原始记录这件事，邵川有动机——而韩松也有理由拦他。"
  - id: c5
    title: 群里那条消息
    text: |
      部门群 · 年会当天 17:12

      邵川：「我今晚不去，手上有点事。」

      同一时段，行政的座位表上，第二桌有他的名字。
    supports: "他公开说过不去，而 22:41 又上了楼 —— 这一条是矛盾，而矛盾本身不是罪。它只是让 c1 那条记录变得需要解释。"

emotional:
  - setup: "韩松在年会上那句「换人」，是他把郑野从一个要爆的模块上摘出去 —— 而郑野整晚都在想「我哪做得不对」"
    channel: "交接单还没下来这件事本身；以及模块内部代号与邵川那条线重了"
    reveal_at: reveal
    object: "一份没发出去的交接单草稿，起草人在韩松的电脑里"
    # `object_text` 不是 schema 字段，而这一步必要：这件实物是郑野那条动机的全部落点，
    # 不把原文放在这儿，DM 在复盘时无字可念，只能现编。
    object_text: |
      内部交接单（草稿，未发出）· 起草人：韩松

      事由：模块 X-3（对外称「交付中台」）于下周三客户验收后整体移交 S 组。
      说明：X-3 与 S 组在做的 Y-1 是同一套底层的两个封装，验收风险由 S 组统一承接。
      **郑野不进本次验收责任表** —— 他在 X-3 上做的是产品侧，技术结论不归他。

      （未落款，未发出。文档属性显示最后编辑时间：昨晚 22:50。）

phases:
  - id: self-intro
    name: 自述
    rule: "每个玩家说出自己昨晚的经历；AI 玩家由 DM 单独引导，逐个上桌"
  - id: inquiry
    name: 问话
    rule: "玩家可自由向任何人提问，无轮次上限；DM 可以提示『该搜证了』但不给暗示"
  - id: search
    name: 搜证
    rule: "一次性给出五条线索，不因为谁被怀疑而增减"
  - id: final
    name: 发言与投票
    rule: "每人说一次『我怀疑谁、为什么』，玩家最后投票"
  - id: reveal
    name: 复盘
    rule: "真相时间线 + 每人的秘密 + 情感线收拢 + 三个验收问题"

briefing:
  steps:
    - at: "自述"
      detail: "每个玩家说自己昨晚的经历。AI 玩家逐个上桌，一人一段。"
    - at: "问话"
      detail: "自由提问，无轮次上限。你只维持桌面，不替任何人推理。"
    - at: "搜证"
      detail: "一次性给出五条线索。给出后不再增减，谁被怀疑都一样。"
    - at: "发言与投票"
      detail: "每人说一次『我怀疑谁、为什么』，玩家最后投票。你把票型记下来。"
    - at: "复盘"
      detail: "真相时间线 + 每人的秘密 + 情感线收拢 + 三个验收问题。"
  limits:
    - "不给暗示——玩家卡住时只能复述他已经知道的事实"
    - "不加线索——五条就是五条，不因为谁被怀疑而增减"
    - "不替玩家推理——谁的话跟谁的话撞了，那是玩家自己的活"
    - "抄原话时一个字不改，哪怕那句话本身看着不对劲"
    - "这个本子里的技术名词点到为止，不展开原理——玩家不需要懂压测也能破案"

style:
  lines:
    - "严格来说，那段我没参与。"
    - "我上去拿了个东西。"
    - "他自己答应的，他自己去改。"
    - "别在会上说。"

audit:
  focus:
    - "与角色本不符——某人说了自己不可能知道的事"
    - "前后矛盾——同一件事两轮里说得不一样"
    - "时间线对不上——某人的说法与门禁、打印机或真值时间线冲突"
  authority: "只报告，不结论。判『越界』的输入是 roles[*].knows——他说出那里没有的东西，就是越界。特别注意谁说得出 22:47 那份打印，以及谁在回避「消防通道」这四个字。"

reveal:
  steps:
    - "把真相时间线按顺序说一遍（一段一个人）"
    - "说清韩松那句「换人」的真实用意 —— 他是在把郑野从一个要爆的模块上摘出去"
    - "解释三个『其实不是』：郑野发过消息但没上楼；吴敏抽屉里那份材料与昨晚无关；谭立上楼的时候人已经倒下了"
    - "把三样东西摆在一起：22:41 的门禁、22:47 的打印、消防通道那根拉断的挂绳"
    - "每人的秘密各说一遍"
  questions:
    - "有没有哪个 AI 玩家的话真的影响了你的判断？"
    - "有没有哪一刻你特别想追问某个人？"
    - "这次有没有『咯噔一下』？"

