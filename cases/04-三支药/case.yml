truth:
  culprit: p1
  accident: true
  narrative: |
    何淑兰的丈夫胰腺癌晚期，在家靠镇痛泵撑着。昨天下午泵里的量就不够了，管床医生说
    要等今天查房才能调。她等不到今天。

    昨晚 21:30 她按正常时间签退，从侧门出楼。在楼外待到 21:40，又刷卡进来——她需要
    药房的门禁记录显示"有人在里面"，因为自动柜的取药流程要求柜门开启期间药房门禁必须
    处于已进入状态。

    21:52，她在自动柜上用工号加指纹取走三支芬太尼。她把药装进随身带的护士服口袋。

    22:05 她从侧门出去，直接回家。

    **周明远不在她的计划里。** 他昨天晚上留在办公室，是因为他要核对药品那部分的账——
    上个月郑宏查的是耗材，而他自己又发现药品这边的数字对不上。

    二十点三十一分，他给沈青打电话，说了半句「沈青，药房那个账——」，然后停住了。

    **停住不是因为有人进来**——是他自己想起来这话不该在电话里讲。他改口「算了，明天说」，
    想当面谈。他上个月就在核这笔账，而那时候他手里还没有具体的数。

    二十二点十分前后，他在一张十月的药品入库单上看见了那个工号。他在旁边写了一行铅笔字，
    又把工号那一串划了一下——他认得它。

    （那张单子第二天早晨还在桌上，见 c4。那是他死之前最后写下的东西。）

    二十二点十三分，何淑兰推开办公室的门——她不是被叫来的，是她自己上来的。

    她本来只是想解释。她说了她丈夫的事。而周明远说了一句「这个我不能不管」。

    推搡里他失去平衡，后脑磕在桌角上。她扶了他一下，然后发现他还在呼吸——
    而她站在那里，没有打电话。

    二十二点三十七分，她离开办公室，走侧门出去。

    沈青在 21:05 回过一个电话。那时候周明远还活着——他在办公室核账，没听见。
