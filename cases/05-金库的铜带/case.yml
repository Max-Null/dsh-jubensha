truth:
  culprit: p1
  accident: false
  narrative: |
    沈曼卿的父亲三年前在通和存了四千两百块，那是他一辈子的钱。他死后账上只剩三百，
    而陆敬之给的说法是「当年买了公债，亏了」。

    她不信。这三年来她一直在找那本内账——记着真实去向的那一本，就锁在金库里。

    她找后门的铜匠配了一把钥匙。昨晚二十二点四十分，她去取。

    **一把就够。** 行里的规矩是两把分持、两人同时在场——可那是一条规矩，不是一道锁：
    两把钥匙开的是同一个孔，齿形一样。

    **她要的不是偷钱，是那本账。** 而她需要一个门还开着的时候。昨晚十一点交班，
    是最好的时候：那十分钟里陆敬之在锁库，门开着，两把钥匙都插在孔里。

    她二十二点五十五分从正门回来，门房看见了她。二十三点，她上楼。

    陆敬之正在锁金库。他看见了她手里的那把钥匙。

    他没有喊人。他把铜带从时间锁上扯下来一段——那是他最后一次想替谁遮一件事：
    铜带上的时刻能证明她开过库。而他扯掉的那一段，恰恰是**保护她的那一段**。

    然后她从他背后动了手。用的是金库门上那只铜把手。

    她拿走了内账，把钥匙串从陆敬之身上取下来放回他怀里——**她只配了一把，那把还在她自己身上**。

    二十三点四十分她离开行里。

    那本内账现在在她亭子间的床板底下。
