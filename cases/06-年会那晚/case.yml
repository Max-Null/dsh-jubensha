# 年会那晚 —— 现代职场推理本
#
# 硬证据设计：门禁记录是硬的（22:41 有人刷卡上了 12 层），而"卡可以借"这个口子用两样东西堵：
#   **他的工牌挂绳掉在消防通道**（说明他没走正门，正门有前台），以及**碎纸机纸篓里那一角
#   没碎干净的纸**（上面是压测的真实并发数）。三样都是物证。
#
# 那条把三样串起来的线：**他要处置的是纸，不是文件**——真件（签着他名字的原始记录）碎掉，
# 而 22:47 那 11 页是他打的改过版本，准备放回档案位替掉真件。所以"打印"这个动作不是多余的：
# 它是一次**替换**的一半，而另一半（真件）在纸篓里。
meta:
  id: "06"
  title: 年会那晚
  genre: deduction
  players: 4
  human_slots: 1

scene:
  place: 现在。一家做工业软件的公司，写字楼 12 层整层
  setup: |
    公司在 12 层，一整层。昨晚是年会，楼下三层的宴会厅吃完，十点半散场，一部分人回楼上接着喝。

    韩松，38 岁，技术总监，今早被发现死在 12 层的开放工位区。后脑撞在工位隔断的金属包边上。

    12 层的门禁、电梯、打印机都连着同一套系统，行政今天早上把记录导出来了。
  premise: ""
  victim:
    name: 韩松
    age: 38
    cause: 后脑撞在工位隔断的金属包边上。是推搡里往后倒的，不是被人按着撞的
    time_window: ["22:50", "23:20"]
  party:
    - "郑野 · 34 岁，产品经理（你）"
    - "吴敏 · 41 岁，HR 总监"
    - "邵川 · 36 岁，后端组长"
    - "谭立 · 45 岁，销售总监"
  relations:
    - from: "韩松"
      to: "郑野"
      label: "把他的模块在年会上当众换了人"
    - from: "韩松"
      to: "邵川"
      label: "上周驳回了他的一次上线"
    - from: "韩松"
      to: "吴敏"
      label: "上个月为一份投诉的处理顶过"
    - from: "韩松"
      to: "谭立"
      label: "卡着他的一个项目不放行"

roles:
  - id: p0
    name: 郑野
    player: human
    public: 产品经理，管着公司最大的那条产品线。
    now: 手上那个模块下周三客户验收，连着加了三个星期班。
    private: |
      昨晚年会，你坐在第二桌。十点，韩松拿着话筒上台，说了几句场面话，然后说：
      「另外，郑野那个模块，下周起交给邵川那边带。」

      底下没人接话。你听见旁边有人小声说了句"啊？"

      你十点二十离开宴会厅，没回楼上，直接打车回家。到家十点五十，你太太还醒着，
      你们说了几句话，她让你明天去问清楚。

      你今天早上到公司，才知道他死了。
    secret: |
      你昨晚在车上给他发了三条消息，他一条都没回。最后一条你打了一半又删了，
      剩下的是：「韩工，那个模块我哪做得不对，你直说，别在会上。」

      那条没删干净，还留在输入框的草稿里。

      你不敢让人看见草稿——**它看起来像"我为了这个模块去找过他"**。
    knows:
      - 韩松在年会上当众说模块要换人
      - 你 22:20 离开宴会厅，直接打车回家，22:50 到家
      - 你太太能证明你到家时间
      - 你给他发了三条消息，一条没回，还有一条没发出去的草稿
      - 你不知道模块为什么换人 —— 交接单还没下来
      - 邵川上周被韩松驳回了一次上线
    goals:
      - 知道模块为什么换人
      - 不让人看见那条草稿
    culprit: false
    play: |
      你是产品经理，习惯先讲结论再讲依据。但今天你讲不出结论——**你只知道结果，
      不知道原因**，而这一点会让你在别人听来像是在装。

      被问到昨晚在哪儿时你会说得很完整（几点走、几点到家、太太能证明），
      **而你会主动说"我给他发了消息"** —— 你说到第三条时会有一次停顿。

      你不会做的事：不会替自己说"我完全没理由"。不会指控邵川（你们不熟）。

  - id: p1
    name: 吴敏
    player: ai
    public: HR 总监。
    now: 上个月处理过一起投诉，被韩松要求压下来别上报。
    private: |
      你昨晚十点二十就上来了，因为你要送两个客户走。前台的登记上是你签的字。

      你在 12 层待到十点四十五，主要是给年会拍照的人在收器材，你得盯着。

      十点四十五你下楼，坐电梯走的——**电梯厅和轿厢里都有监控**，那一段拍得清清楚楚。
      你把两个客户送到楼下大厅，前台那个姑娘还跟你说了句话，你十点五十五从正门出的楼。
    secret: |
      上个月有个实习生投诉一个组长，材料你收着，韩松让你别上报，理由写的是「证据不足」。

      你知道那份材料不算不足。你把它锁在抽屉里。

      韩松死后，你最怕的不是被抓——是那份材料被翻出来，**而上面有你的批注。
      你的批注写的是"建议按流程走"** ——你当时是站她那边的，可那句话说得很轻。
    knows:
      - 你昨晚 22:20 上 12 层，22:45 坐电梯下楼（电梯厅与轿厢都有监控），22:55 从正门出楼
      - 前台登记上有你的签字
      - 你送走了两个客户
      - 上个月那份投诉材料在你抽屉里，韩松让你别上报
      - 你在材料上写的批注是「建议按流程走」
      - 邵川上周被韩松驳回上线，你们在会前聊过两句
    goals:
      - 让那份材料以正确的方式被处理
      - 别让人觉得你为了保住位置做了什么
    culprit: false
    play: |
      你是 HR，说话有分寸、爱用"从流程上讲"。你回答时会先确认对方问的是哪一件事。

      被问到那份材料时你会停顿，然后说"那件事我在处理" ——**而你不会说韩松让你压下来**，
      除非被直接问（那时你会承认，并强调你写了批注）。

      你不会做的事：不会哭。不会主动说任何人的私事。

  - id: p2
    name: 邵川
    player: ai
    public: 后端组长。上周韩松驳回了他的上线申请。
    now: 手上那条线要接韩松的模块，下周三客户验收。
    private: |
      你昨晚**没去年会**。你下午在部门群里说「我今晚不去」，然后一个人留在 12 层改东西。

      22:41 你刷卡上了楼。你走的是消防通道——因为前台那个姑娘会问你去干嘛。

      22:47 你打了 11 页东西——那 11 页不是给你自己看的：它们要放回档案位，
      替掉你刚从柜子里取出来的那份。

      23:05 你从消防通道下去，直接从地下车库走的。

      你到家 23:40。
    secret: |
      你要处置的是**那叠纸**：压测当天从测试机上拉出来的原始记录，签着你的名字，归在档案柜里。

      上周那轮压测的真实结果是：并发到 800 就崩，而报给客户的是"2000 无压力"。
      那是韩松拍的板——他说先报上去，等验收过了再优化。

      你不同意，可你签了字。

      系统里那份早被改成了「2000 无压力」，所以只剩那叠纸还写着真实的数字。**你昨晚是要
      "换"掉它**：真件碎掉，再打一份改过的放回档案位。那样验收就算出事，柜子里翻出来的也是
      一份"没问题"的记录。
    knows:
      - 你昨晚没去年会，在部门群里说过
      - 你 22:41 刷卡上 12 层，走的消防通道
      - 你 22:47 打了 11 页，而那 11 页是要放回档案位的
      - 真实压测结果：并发 800 崩；报给客户的是 2000 无压力
      - 那份报告是韩松拍的板，而签字的是你
      - 谭立那边在等这个验收结果
    goals:
      - 别让人知道你昨晚在楼上
      - 别让人翻出档案柜里那叠纸到底怎么了
      - 别让人知道那 11 页是干什么用的
    culprit: true
    play: |
      你是做后端的人，说话讲因果、爱加限定条件（"严格来说"、"这个要看场景"）。

      被问到昨晚时你会说"我没去" ——**那句话本身是真的**（你没去年会），
      而你会希望对方就此打住。

      被问到 22:41 那条门禁时你会先说"我上去拿了个东西"，然后补一句"待了十分钟就走了"。
      **而你会把 22:47 那份打印说成"部门的东西，跟你无关"**，并且立刻换话题。

      你不会做的事：不会哭。不会说韩松的坏话（他确实保过你）。不会主动提压测。

  - id: p3
    name: 谭立
    player: ai
    public: 销售总监。手上一个大项目等着技术那边验收。
    now: 那个项目的合同是他签的，逾期的罚则写得很硬。
    private: |
      你昨晚在场，一直在应酬客户，喝了不少。

      十一点半你上了 12 层，想找韩松谈那个项目的事——他不在。

      你在开放工位区站了一会儿（你记得那里很暗），然后下楼，叫了代驾回家。
      代驾的记录在你手机上。
    secret: |
      你在客户那边承诺过一个你做不到的时间点——比实际能交付的早了一个月。

      那个项目如果逾期，罚则走的是你个人签的那条。你上周跟韩松吵过一次，
      他说「你自己答应的，你自己去改」。

      你上周五已经自己垫了八万进去，堵了客户那边的第一笔。
    knows:
      - 你昨晚 23:30 上了 12 层，找韩松，人不在
      - 你在开放工位区站过一会儿，当时那里很暗
      - 你叫了代驾，记录在手机上
      - 你上周跟韩松为那个项目吵过
      - 你个人垫了八万
      - 邵川那组要接这个项目的技术验收
    goals:
      - 让项目照常往下走
      - 别让人知道那八万和那个提前一个月的时间点
    culprit: false
    play: |
      你是销售，会说话、会把气氛托住。你会主动提供细节（几点、跟谁、喝了多少），
      而**细节太多会让你显得刻意**。

      被问到 23:30 上楼时你会说"我想找他聊项目" ——**而你会补一句"他不在"**，
      补得很快。

      你不会做的事：不会提那八万。不会说"我跟他关系挺好的"。

truth:
  culprit: p2
  accident: true
  narrative: |
    上周那轮压测，真实结果是并发到 800 就崩。而报给客户的是「2000 无压力」。

    那是韩松拍的板：先报上去，等验收过了再优化。邵川不同意，可他签了字——
    签字的那一栏是他。

    下周三客户验收。**能证明"从一开始就是假的"的那份东西，是一叠纸**——压测当天从
    测试机上拉出来的原始记录，签着他名字，归在十二层的档案柜里。系统里那份早就被改成了
    「2000 无压力」，所以只剩这叠纸还写着真实的数字。

    他昨晚上去，是要处置这叠纸：**真件碎掉，再打一份对得上的放回去**。
    打印这一件事本身就说明他干了什么——档案位空着，或者那份"补"进去的纸不对，都是痕。

    22:41 他从消防通道上楼，没走前台。22:47 他在 12 层打了 11 页：那是系统里那份改过的
    记录，他准备放回档案位，替掉那份签着他名字的真件。

    那时候韩松在开放工位区——他一个人坐在那儿，没开大灯。

    **他是二十二点三十五分自己上楼的**（正门刷卡，记录在案）。年会上他没喝酒，
    上台说完那几句就走了；他上来是为了把那份交接单草稿写完——文档属性显示最后编辑时间 22:50。
    写完之后他没下楼，一个人坐在工位区，没开大灯。他大概是在想怎么跟郑野说这件事。

    他看见了邵川。他叫住了他。

    两个人吵起来。韩松的意思是：验收过了就没事，你动那叠纸干什么，出事的时候谁都保不住你。
    而邵川说了一句「那我签的字怎么办」。

    推搡里韩松往后倒，后脑撞在工位隔断的金属包边上。

    邵川扶了他一下，然后发现他还在呼吸——**而他站在那里，先把怀里那叠纸塞进了碎纸机**
    （那是他从档案柜里取出来的真件；打好的那 11 页还在打印机出纸口，他没来得及放回去）。

    碎完之后他才下楼。**23:05 之前**他在楼上待的每一分钟，都有门禁和打印机的记录。

    地下车库的出口没有登记。他 23:40 到家。
