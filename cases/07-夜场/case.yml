truth:
  culprit: p3
  accident: true
  narrative: |
    **没有人推他。** 这一点是这个本子最要紧的地方。

    三号吊杆的配重昨天下午卡住了——那根杆挂的是最后一幕的那块大景片，
    明天换场要往下放两米。沈砚要在明天之前把它弄好，而高台边上那截护栏挡着他的工具箱。
    他下午把那截护栏拆了一头，打算弄完装回去。

    21:38 苏晚看见他的时候，他正背对着她在弄那截护栏。她想跟他说话，没开口就走了。

    22:00 武斌在二楼控制室调限位。他调完就走了，什么都没听见。
    而那一杆动了——钢丝带起来的振动，把松着一头的那截护栏震脱了。
    沈砚正蹲在边上。

    **武斌不知道这件事。** 而他知道的是另一件事：那条日志上写着 22:00、写着沈砚的名字，
    而全团只有两个人是管理员。他要是说出来，所有人都会知道他在那个时间动过限位——
    而他下午刚跟周迟说过"后台那套东西没问题"。

    所以他改口了。他说他 22:00 在侧幕帮忙收景片。
    一个跟了后台二十年的人，撒了一个谁都查得出来的谎——因为他怕的不是杀人，
    是"后台那套东西没问题"这句话被翻出来。

    苏晚 22:20 上去的时候他还活着，还有温度。她摸过他，然后跑了。
    她什么也没说，因为她怕别人把她钉在最后那十分钟上。
    而那十分钟里，她其实是唯一一个没想害他的人。
