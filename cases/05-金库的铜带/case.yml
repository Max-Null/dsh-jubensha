# 金库的铜带 —— 民国推理本
#
# 硬证据设计：金库是**双钥匙 + 时间锁**。时间锁的开关记录打在一条铜带上，撕不掉；
# 而双钥匙里有一把是私配的——锁匠能验齿形。**钥匙在谁身上、齿形对不对，那是物证，
# 不是"他说谎"**。所以这个本子里凶手没有"我记错了"这条路。
