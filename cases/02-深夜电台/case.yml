# case-02「深夜电台」的 YAML 版 —— 由 `cases/02-深夜电台/dm-handbook.md` 逐字段填出来的。
#
# **它为什么存在**：`tests/fixtures/case-03.yml` 是情感本，只验了 schema 的一半。
# 推理本专属的那几段——`truth.culprit`、`clues[*].supports`、`truth.timeline`、
# `truth.misdecisions`——在情感本里全是空的，也就是说**没被填过一遍**。
# 这一份把它们都填满，于是有两个用处：
#
#   ① schema 对推理本够不够用，有了判据（填不下去的地方就是缺口）；
#   ② `jubensha_case action="clue"` 有了一份能跑的输入——线索进牌桌那条路
#      在此之前只有单元测试，没有工具面的验证。
#
# 内容按 v1.0 的字段顺序重排过，**事实一律取自原手册**，没有新增设定。

meta:
  genre: deduction
  id: "02"
  title: 深夜电台
  players: 4
  human_slots: 1
  est_rounds: [12, 20]
  difficulty: normal
  tags: [推理, 封闭, 情感]
  # 手册里三处"看着显眼其实另有原因"的细节。写本时把它们记下来，是为了让 DM
  # 分得清"玩家该去挖的"和"故意摆出来误导的"。
  red_herrings:
    - "吴国强关掉调音台录音：看着像毁灭证据，实际是怕留下'有人动过资料'的记录"
    - "周远跟死者吵架：实际是误会——老程要读的正是他二十年前写的那封信"
    - "林蕾的狠话与买断动机：谈崩就走，与案子无关"

scene:
  place: "市广播电台 · 老楼二层的直播间"
  setup: |
    程守仁（老程），58 岁，深夜节目《午夜信箱》的主播，做了二十年。昨晚是最后一期。
    今早 6:40，清洁工进直播间打扫，发现他伏在调音台上，人已经凉了。
    法医说死因是心脏骤停——他有冠心病史。但左前臂内侧有一道指甲造成的掐痕。
    死亡时间：昨晚 22:00–22:45。
    四个人昨晚都在台里。
  premise: "他是在有人来过之后死的——那几分钟里，只要有人打个电话，他大概能活。"
  victim:
    name: "程守仁"
    age: 58
    cause: "心脏骤停（有冠心病史；左前臂内侧一道指甲造成的掐痕）"
    time_window: ["22:00", "22:45"]
  party:
    - "周远 · 二十年的老听众，昨晚被请来做最后一期的嘉宾"
    - "吴国强 · 跟老程搭档二十年的导播"
    - "林蕾 · 台里新派来的节目负责人"
    - "苏雨 · 跟老程半年的实习生"

roles:
  - id: p0
    name: "周远"
    player: human
    public: "42 岁，《午夜信箱》二十年的老听众，昨晚被老程请来做最后一期嘉宾。"
    now: "还在上夜班的那家厂里做技术，孩子上初中，日子过得四平八稳。"
    private: |
      22:25 到台里（门禁记录对得上）。你带了一封信，想当面交给老程。
      等的时候看了一眼他桌上摊着的一页稿子——上面有你的名字。
      你以为他要在节目里读你写的那封信，当场炸了。你们吵了一架，你 22:33 摔门走了。
      你走的时候他坐在调音台前，还活着。
    secret: |
      你写给电台的信，大部分是编的。
      二十年前你妈妈走的那阵子，你写了第一封——那是真的。
      后来你编了一个「一直在流浪的孤儿」的身世，因为那样才会被念出来。
      你怕老程早就知道了。
    knows:
      - "你 22:33 走的时候，老程坐在调音台前，还活着"
      - "他桌上摊着的那页稿子上有你的名字"
      - "你带了一封信想交给他，那封信还在你身上"
    goals:
      - "查清那几分钟——他是死在谁手上的"
      - "别让人知道你那封信是编的"
      - "搞清楚他到底打算在节目里说什么"
    play: |
      你的痛处是「我编了一个身世，还骗了自己二十年」。
      你会先解释那封信，解释得比问到的多。
      被问到稿子上的名字时你会绕开——绕得不够自然，别人看得出来你有事。
      你不会主动说出那封信是编的。

  - id: p1
    name: "吴国强"
    player: ai
    public: "55 岁，跟老程搭档二十年的导播（音乐编辑）。"
    now: "台里这两年一直在裁人，你手上已经没什么节目了，每天去点个卯。"
    private: |
      22:08 到，22:20 走（跟门禁记录对得上）。
      你来搬一整箱听众来信——台里清理的时候会当废纸扔掉，二十年的东西。
      为了不留「有人动过资料」的记录，你顺手关掉了调音台的录音。
      你走的时候老程还活着，还跟你说了一句「你拿走吧，反正也没人要了」。
    secret: |
      你搬走了那箱信，而且你关掉了录音。
      两件事都不该是你干的——你没跟任何人打招呼。
    knows:
      - "你 22:17 关掉了调音台的录音"
      - "你走的时候老程还活着，还跟你说了话"
      - "那箱信现在在你车后备箱里"
    goals:
      - "别让人知道那箱信是你搬的"
      - "别让人知道录音是你关的"
    play: |
      你对「录音」这个词会敏感——不是躲，是反应会慢半拍。
      你不想多说话。能一个字答完的，你不会答一句。
      被逼急了你会说「那箱信算什么证据」——说完你自己也知道说漏了。
      你不会主动交代搬信和关录音，但也不会编一个严丝合缝的谎。

  - id: p2
    name: "林蕾"
    player: ai
    public: "38 岁，台里新派来的节目负责人。"
    now: "刚接手这档节目的调整，上面给的指标压得很紧。"
    private: |
      21:48 到，22:06 走。你是来谈素材买断的——台里想低价买断老程二十年的节目素材。
      他不签。你说了句狠话：「你不签，这些东西你一样带不走。」
      你走的时候老程还活着。
    secret: |
      那句狠话；以及——你其实不想停这个节目。
      停播是上面的决定，你只是被派来执行的那个人。你不敢说。
    knows:
      - "你 22:06 走的时候老程还活着，人没事"
      - "台里对素材买断的底线比你跟他说的更低"
    goals:
      - "别让人把那句狠话当成动机"
      - "别让人知道你其实不想停这个节目"
    play: |
      你会主动进攻，把水搅浑——先问别人的时间，少说自己的。
      压错了你不肯回头，越被追问越硬。
      被问到狠话时你会说「那是气话，谁谈生意不撂狠话」。
      你不会主动说停播是上面的决定。

  - id: p3
    name: "苏雨"
    player: ai
    public: "23 岁，跟老程半年的实习生。"
    now: "节目停了，她这半年等于白干，到处投简历没有回音。"
    private: |
      你跟老程学了半年。你想留下来，但节目停了。
      这半年你一直趁他不在，用他的设备录自己的节目，存在调音台的外接硬盘里，
      准备攒够作品去别的台应聘。

      **你今晚根本没走。** 22:00 之前你就在楼里了，一直待在二楼的剪辑间——
      你想等节目播完再上去把硬盘取走。门禁只记时间不记人，所以这件事没留痕。

      22:33 楼下的门响过一次，你听见了（那是林蕾出去）。

      22:35 你从剪辑间上楼，进直播间取硬盘。他发现了——他其实早就知道，一直没说，
      想等你自己开口。

      你们争执起来。你推了他一下。他往后靠在调音台上，捂着胸口慢慢滑下去。

      你看着他，然后做了三件事：拿了硬盘；没有叫救护车，也没有报警；
      22:41 你在调音台上把节目设成自动播放，让时间表照常走完——
      这样外面看着一切正常，没人会去敲直播间的门。

      22:41 你刷卡出楼。**他是在你走之后死的。**
    secret: |
      人是你推的，而且你没救他。
      你 22:41 才走——而不是你对外说的 22:10。
    knows:
      - "你 22:00 之前就进了楼，一直在二楼剪辑间；门禁里没有你的进出记录"
      - "你 22:35 从剪辑间上楼进直播间，22:41 刷卡出楼"
      - "他倒下去的时候还活着"
      - "自动播放是你设的（22:41 那条操作日志）"
      - "他其实早就知道你偷录节目，一直没说"
      - "**你对外说的是**：22:10 就刷卡出大门回家了——而记录里根本没有 22:10 那一条"
    goals:
      - "别让人知道你今晚一直在楼里"
      - "别让人问你 22:30 之后的事"
    play: |
      你会准备一条非常完整的时间线，完整得有点刻意。

      **你对外说的是 22:10 刷卡出的大门**——那条记录不存在，而你不知道，
      所以你答得很稳。

      你对「22:30 之后」的问题格外敏感，会先把话头引开；
      而被追问细节时你会答得太细（几点几分、谁穿什么），细到不像回忆。

      你会不自觉说出只有待到最后才知道的事——比如节目后来是怎么播完的。

      你不会主动承认推人，被逼到角落时你会说「我走的时候他还好好的」，
      然后自己听见这句话有多不像真的。

truth:
  culprit: p3
  accident: true
  narrative: |
    苏雨跟老程学了半年，节目停播，她想带着作品去别处。
    这半年她一直趁他不在，用他的设备录自己的节目，存在调音台的外接硬盘里。
    今晚她根本没走——22:00 之前她就在楼里，一直待在二楼的剪辑间，想等节目播完再去取硬盘。
    22:35 她上楼进直播间，老程发现了——他其实早就知道，一直没说，想等她自己开口。
    争执中她推了他一下。他往后靠在调音台上，捂着胸口慢慢滑下去。
    她没有叫救护车，没有报警，拿了硬盘，22:41 又设了自动播放让节目照常播完，刷卡离开。
    **他是在她走之后死的。** 那几分钟里，只要有人打个电话，他大概能活。
  timeline:
    - at: "21:48-22:06"
      who: p2
      doing: "谈素材买断，老程不签，她撂下狠话走了"
      witness: []
    - at: "22:00 之前"
      who: p3
      doing: "进楼，一直在二楼剪辑间（门禁只记时刻不记人，这一段没有她的进出记录）"
      witness: []
    - at: "22:08-22:20"
      who: p1
      doing: "来搬走一箱听众来信；为不留记录，22:17 关掉了调音台的录音"
      witness: []
    - at: "22:25-22:33"
      who: p0
      doing: "来送信；看见稿子上有自己的名字，以为老程要读他的信，吵了一架摔门走"
      witness: []
    - at: "22:35"
      who: p3
      doing: "从剪辑间上楼进直播间取硬盘，被发现，争执，她推了他"
      witness: []
    - at: "22:41"
      who: p3
      doing: "他倒下后她没有叫救护车，拿了硬盘，在调音台上设了自动播放，刷卡离开"
      witness: ["台子上的操作日志"]
  key_facts:
    - "门禁最后那条「22:41 出」没人认领，而且记录里没有跟它配对的「进」——这个人 22:00 之前就在楼里"
    - "**22:41 调音台的日志动过：播放模式改成自动、存档条目改了名** —— 那个时刻有人站在这张台子前，而那时老程已经倒下了"
    - "苏雨自称 22:10 刷卡出大门，而门禁记录里没有 22:10 这一条"
    - "调音台的录音停在 22:17——那时有人在直播间动过设备（那是吴国强，不是她）"
    - "死前有过肢体接触：左前臂一道掐痕；他倒下得很快，没有挣扎痕迹"
  misdirections:
    - "吴国强（主误伤）：他 22:17 关了录音，22:20 从门禁出去——那一段与他自己的说法对得上，可「关录音」这个动作看着就是那个动过设备的人"
    - "周远（次误伤）：22:33 摔门走，是那一晚最后一个离开的客人，而且他刚跟死者吵过架"
    - "林蕾（轻误伤）：有利益动机（买断谈崩）、临走撂了狠话"
  after:
    - "《午夜信箱》按自动播放的时间表播完了最后一期——外面没有人知道，最后一期是在主播已经倒下之后播完的"
    - "台里今天早上才知道这件事；节目素材买断的事不会再有人提了"

clues:
  - id: c1
    title: "台子上的操作日志"
    text: |
      调音台 · 节目日志（台里存档用，每次改动都记时刻）

      22:17  ——  录音停止（手动）
      22:41  ——  播放模式改为「自动」，节目按时间表续播
      22:41  ——  存档条目由「林蕾」改为「待定」

      注：日志只记时刻，不记人。
    supports: |
      **这一条是这个本子的硬证据。** 22:41 有人站在这张台子前，把节目改成了自动播放——
      而法医的窗口是 22:00–22:45，那时老程已经倒下去了。
      所以：**22:41 站在那张台子前的人，就是最后一个见他活着的人。**
      而门禁记录（c3）里 22:41 那条「出」无人认领，两条合起来才成链：
      她在楼里，而她在台子上动过手。
      注意：22:17 那条停止录音是吴国强做的（他来搬信），别把两条混成一条。

  - id: c2
    title: "调音台的录音停在 22:17"
    text: |
      他有录自己节目存档的习惯。文件停在 22:17。
      最后几秒是一段模糊的杂音。
    supports: |
      能推出 22:17 有人在直播间、动过设备。那段杂音是碰到了设备，不是说话——
      说「像有人碰到了设备」是判断，所以它写在这儿而不是牌桌上。
      注意：这条会咬到吴国强（他关的录音），而他关录音是为了别的。

  - id: c3
    title: "一楼门禁记录"
    text: |
      老楼的门禁只记时间，不记人。昨晚 22:00 之后的记录：
      22:06 出 · 22:08 进 · 22:20 出 · 22:25 进 · 22:33 出 · 22:41 出
    supports: |
      能推出 22:00 之后进出六次。前五次能对上前三个人的说法，
      最后那条「22:41 出」没人认领——而且记录里没有跟它配对的「进」，
      说明这个人 22:00 之前就在楼里，一直在。
      破局点：苏雨说她 22:10 就刷卡出大门了——记录里没有 22:10 这条；
      而那条无人认领的 22:41，位置恰好落在她自称离开之后。

emotional:
  - setup: |
      老程打算在最后一期读的，是他二十年前收到的第一封信。
      写信的人就是周远——那年他妈妈走了，他睡不着，写了那封信。
      他想读它，作为告别。
    channel: "桌上摊着一页手写的稿子，压着一封旧信；稿子上有周远的名字"
    reveal_at: reveal
    object: "二十年前的那封听众来信"

phases:
  - id: self-intro
    name: 自述
    rule: "每个玩家说出自己昨晚的经历；AI 玩家由 DM 单独引导，逐个上桌"
  - id: inquiry
    name: 问话
    rule: "玩家可自由向任何人提问，无轮次上限；DM 可以提示『该搜证了』但不给暗示"
  - id: search
    name: 搜证
    rule: "一次性给出三条线索，不因为谁被怀疑而增减"
  - id: final
    name: 发言与投票
    rule: "每人说一次『我怀疑谁、为什么』，玩家最后投票"
  - id: reveal
    name: 复盘
    rule: "真相时间线 + 每人的秘密 + 情感线收拢 + 三个验收问题"

briefing:
  steps:
    - at: "自述"
      detail: "每个玩家说自己昨晚的经历。AI 玩家逐个上桌，一人一段。"
    - at: "问话"
      detail: "自由提问，无轮次上限。你只维持桌面，不替任何人推理。"
    - at: "搜证"
      detail: "一次性给出三条线索。给出后不再增减，谁被怀疑都一样。"
    - at: "发言与投票"
      detail: "每人说一次『我怀疑谁、为什么』，玩家最后投票。你把票型记下来。"
    - at: "复盘"
      detail: "真相时间线 + 每人的秘密 + 情感线收拢 + 三个验收问题。"
  limits:
    - "不给暗示——玩家卡住时只能复述他已经知道的事实"
    - "不加线索——三条就是三条，不因为谁被怀疑而增减"
    - "不替玩家推理——谁的话跟谁的话撞了，那是玩家自己的活"
    - "抄原话时一个字不改，哪怕那句话本身看着不对劲"

style:
  lines:
    - "那是气话，谁谈生意不撂狠话。"
    - "你拿走吧，反正也没人要了。"
    - "我走的时候他还好好的。"

audit:
  focus:
    - "与角色本不符——某人说了自己不可能知道的事"
    - "前后矛盾——同一件事两轮里说得不一样"
    - "时间线对不上——某人的说法与门禁记录或真值时间线冲突"
  authority: "只报告，不结论。判『越界』的输入是 roles[*].knows——他说出那里没有的东西，就是越界。"

reveal:
  steps:
    - "把真相时间线按顺序说一遍（五段，一段一个人）"
    - "说明死因：他倒下的时候还活着，那几分钟里只要有人打个电话，他大概能活"
