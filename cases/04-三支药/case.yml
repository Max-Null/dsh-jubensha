    - "李维：他说不清自己在删什么，而删记录的时间正好落在窗口里 —— 那是他与上一任的聊天记录，与案子无关。他会主动说「账不是我动的」，而没人问过。"
    - "郑宏：他 21:00 到 22:20 在楼里、走的是没有监控的楼梯，而他与周明远上个月有过不愉快 —— 那是他在悄悄收拾离职的东西，以及一张被他压下的耗材采购单。"
    - "沈青（玩家自己）：他昨晚接过死者的电话却没提，而且他还有一份三年前被压下来的病历 —— 那是他的负担，不是他的罪。"
  after:
    - "何淑兰的丈夫在她被带走之后第四天去世，镇痛泵一直没调过剂量"
    - "三年前那份病历后来还是被翻出来了 —— 沈青被停职三个月，最后没有立案"
    - "李维在结案之后才明白他那句「账不是我动的」是什么意思"

clues:
  - id: c1
    title: 五楼的门禁与走廊监控
    text: |
      市二院住院部五楼 · 侧门门禁（2026-10-05）

      21:30  ——— 工号 H0917 刷出
      21:40  ——— 工号 H0917 刷入
      22:05  ——— 工号 H0917 刷出
      22:37  ——— 工号 H0917 刷出

      同楼层正门：21:20 工号 S0231 刷出（此后无记录）

      ─────────────────────────────

      药房 · 缓冲间门禁（同一个读头组）

      21:48  ——— H0917  外门刷入
      21:52  ——— H0917  内门刷入
      22:15  ——— H0917  内门刷出

      ─────────────────────────────

      五楼东头走廊监控（画面，不记工号）

      22:09  ——— 一人自东侧楼梯口进入走廊，深色便服外罩白色外衣，向主任办公室方向
      22:11  ——— 同一人仍在走廊（镜头边缘）
      22:36  ——— 同一人自主任办公室方向返回，向楼梯口离开

      ─────────────────────────────

      六楼走廊监控（画面）

      21:02  ——— 一人推着手推车进入六楼走廊，车上是纸箱（多次往返）
      22:19  ——— 同一人推车离开六楼走廊，向电梯厅方向
    supports: "H0917 是何淑兰。三段记录分别说三件事：① 她自称 21:30 出楼后直接回家，而 21:40 又进来了，22:05 才出去，22:37 又一次刷出——那一次是她第二次离开，在案发之后；② 21:48 到 22:15 她确实在药房里，与自动柜那条取药记录（c2）是**同一扇门**上的两个时刻；③ 22:09 走廊进、22:36 走廊出，那二十九分钟她**人在五楼东头**——主任办公室就在那儿。六楼那两条是郑宏：他在搬东西，而搬的是纸箱，时间也与他的说法对得上。"
  - id: c2
    title: 药房自动柜的取药条目
    text: |
      药剂科 · 自动柜（2026-10-05）

      21:52:07  取药  芬太尼注射液  3 支
                操作人工号：H0917
                生物识别：通过（右手食指）
                柜门开启时长：12 秒
                柜门开启期间房内状态：本机不记录
    supports: "工号可以借，指纹不能 —— 过的是何淑兰的右手食指。而柜门的流程要求：开启的那十二秒里药房门禁必须处于「已进入」状态。所以这条要与 c1 的**药房那三条**对起来看（21:48 外门、21:52 内门、22:15 出）：取药的人就是刷卡进药房的人，两次都是 H0917。**这一段是判断，不是记录** —— 所以它只写在这儿，不进牌桌。"
  - id: c3
    title: 一台没接的电话
    text: |
      沈青的手机 · 通话记录（2026-10-05）

      20:31  呼入  周明远  时长 00:14
      21:05  呼出  周明远  未接听

      运营商基站记录：20:31 时，周明远的手机基站为住院部五楼。
    supports: "通话只有十四秒 —— 他说了半句就停了，然后改口「算了，明天说」。那半句是什么，是玩家自己要问出来的。21:05 那次回拨他没能接。"
  - id: c4
    title: 办公桌上摊开的东西
    text: |
      主任办公室 · 现场（2026-10-05 早晨）

      桌上摊着一份十月的药品入库单，第三页的右下角有一行铅笔字：
        「芬太尼 基数对不上，先不动，我再看看」

      笔迹是周明远的。同一页上有一个被划掉的时间，看不太清，像是「21:5」。
    supports: "他在核对药品账，而且是在死之前就在核。被划掉的时间说明他看到了 21:52 那条记录 —— 他知道是谁。"
  - id: c5
    title: 抢救车领用登记本
    text: |
      药剂科 · 抢救车领用登记（2026 年）

      最近一次填写：09-28  芬太尼 1 支  领用人：何淑兰  核签：李维
      上一次：      08-11  芬太尼 1 支  领用人：何淑兰  核签：李维
      再上一次：    06-30  芬太尼 1 支  领用人：何淑兰  核签：李维
    supports: "抢救车这条路的药不算入账 —— 她以前从这儿拿过三次，都合规。而昨晚她走的是自动柜那条路（c2），那是按支管的。这个对比说明她昨晚为什么不能用老办法：周四的抢救车药物基数刚盘过。"

emotional:
  - setup: "周明远替沈青压下的那份病历，与沈青今天不敢说的那个电话，是同一件事的两面"
    channel: "沈青自己的记忆，以及病历室那份三年前的处方（复盘时才揭示）"
    reveal_at: reveal
    object: "一份三年前的处方单，审核栏上并排着两个名字"

phases:
  - id: self-intro
    name: 自述
    rule: "每个玩家说出自己昨晚的经历；AI 玩家由 DM 单独引导，逐个上桌"
  - id: inquiry
    name: 问话
    rule: "玩家可自由向任何人提问，无轮次上限；DM 可以提示『该搜证了』但不给暗示"
  - id: search
    name: 搜证
    rule: "一次性给出五条线索，不因为谁被怀疑而增减"
  - id: final
    name: 发言与投票
    rule: "每人说一次『我怀疑谁、为什么』，玩家最后投票"
  - id: reveal
    name: 复盘
    rule: "真相时间线 + 每人的秘密 + 情感线收拢 + 三个验收问题"

briefing:
  steps:
    - at: "自述"
      detail: "每个玩家说自己昨晚的经历。AI 玩家逐个上桌，一人一段。"
    - at: "问话"
      detail: "自由提问，无轮次上限。你只维持桌面，不替任何人推理。"
    - at: "搜证"
      detail: "一次性给出五条线索。给出后不再增减，谁被怀疑都一样。"
    - at: "发言与投票"
      detail: "每人说一次『我怀疑谁、为什么』，玩家最后投票。你把票型记下来。"
    - at: "复盘"
      detail: "真相时间线 + 每人的秘密 + 情感线收拢 + 三个验收问题。"
  limits:
    - "不给暗示——玩家卡住时只能复述他已经知道的事实"
    - "不加线索——五条就是五条，不因为谁被怀疑而增减"
    - "不替玩家推理——谁的话跟谁的话撞了，那是玩家自己的活"
    - "抄原话时一个字不改，哪怕那句话本身看着不对劲"

style:
  lines:
    - "他在的时候，这些单子从来不这么摆。"
    - "我就在六楼，谁上来我都看得见。"
    - "不是钱的事。"
    - "这个我不能不管。"

audit:
  focus:
    - "与角色本不符——某人说了自己不可能知道的事"
    - "前后矛盾——同一件事两轮里说得不一样"
    - "时间线对不上——某人的说法与门禁记录或真值时间线冲突"
  authority: "只报告，不结论。判『越界』的输入是 roles[*].knows——他说出那里没有的东西，就是越界。特别注意谁都说了『药房』这个词、以及谁在回避它。"

reveal:
  steps:
    - "把真相时间线按顺序说一遍（一段一个人）"
    - "说明死因：那一下之后他还活着一阵子。二十二点三十七分之前，只要有人打个电话，他大概能活"
    - "解释三个『其实不是』：李维在删的是跟上一任的聊天记录；郑宏在楼里是为了悄悄搬东西，还有一张他压下的采购单；沈青没提那个电话，是因为三年前那份病历"
    - "把两条记录配给玩家看：21:52 的指纹，与同一时刻药房门禁的『已进入』"
    - "每人的秘密各说一遍"
  questions:
    - "有没有哪个 AI 玩家的话真的影响了你的判断？"
    - "有没有哪一刻你特别想追问某个人？"
    - "这次有没有『咯噔一下』？"

