# 年会那晚 —— 现代职场推理本
#
# 硬证据设计：门禁记录是硬的（22:41 有人刷卡上了 12 层），而"卡可以借"这个口子用两样东西堵：
#   **他的工牌挂绳掉在消防通道**（说明他没走正门，正门有前台），以及**打印机在 22:47 打了 11 页**
#   （从 12 层的 IP），而那 11 页在纸篓里留下了一角没碎干净的。三样都是物证。
meta:
  id: "06"
  title: 年会那晚
  genre: deduction
  players: 4
  human_slots: 1

scene:
  place: 现在。一家做工业软件的公司，写字楼 12 层整层
  setup: |
    公司在 12 层，一整层。昨晚是年会，楼下三层的宴会厅吃完，十点半散场，一部分人回楼上接着喝。

    韩松，38 岁，技术总监，今早被发现死在 12 层的开放工位区。后脑撞在工位隔断的金属包边上。

    12 层的门禁、电梯、打印机都连着同一套系统，行政今天早上把记录导出来了。
  premise: ""
  victim:
    name: 韩松
    age: 38
    cause: 后脑撞在工位隔断的金属包边上。是推搡里往后倒的，不是被人按着撞的
    time_window: ["22:30", "23:30"]
  party:
    - "郑野 · 34 岁，产品经理（你）"
    - "吴敏 · 41 岁，HR 总监"
    - "邵川 · 36 岁，后端组长"
    - "谭立 · 45 岁，销售总监"
  relations:
    - from: "韩松"
      to: "郑野"
      label: "把他的模块在年会上当众换了人"
    - from: "韩松"
      to: "邵川"
      label: "上周驳回了他的一次上线"
    - from: "韩松"
      to: "吴敏"
      label: "让她压一份投诉别上报"
    - from: "韩松"
      to: "谭立"
      label: "卡着他的一个项目不放行"

roles:
  - id: p0
    name: 郑野
    player: human
    public: 产品经理，管着公司最大的那条产品线。
    now: 手上那个模块下周三客户验收，连着加了三个星期班。
    private: |
      昨晚年会，你坐在第二桌。十点，韩松拿着话筒上台，说了几句场面话，然后说：
      「另外，郑野那个模块，下周起交给邵川那边带。」

      底下没人接话。你听见旁边有人小声说了句"啊？"

      你十点二十离开宴会厅，没回楼上，直接打车回家。到家十点五十，你太太还醒着，
      你们说了几句话，她让你明天去问清楚。

      你今天早上到公司，才知道他死了。
    secret: |
      你昨晚在车上给他发了三条消息，他一条都没回。最后一条你打了一半又删了，
      剩下的是：「韩工，那个模块我哪做得不对，你直说，别在会上。」

      那条没删干净，还留在输入框的草稿里。

      你不敢让人看见草稿——**它看起来像"我为了这个模块去找过他"**。
    knows:
      - 韩松在年会上当众说模块要换人
      - 你 22:20 离开宴会厅，直接打车回家，22:50 到家
      - 你太太能证明你到家时间
      - 你给他发了三条消息，一条没回，还有一条没发出去的草稿
      - 你不知道模块为什么换人 —— 交接单还没下来
      - 邵川上周被韩松驳回了一次上线
    goals:
      - 知道模块为什么换人
      - 不让人看见那条草稿
    culprit: false
    play: |
      你是产品经理，习惯先讲结论再讲依据。但今天你讲不出结论——**你只知道结果，
      不知道原因**，而这一点会让你在别人听来像是在装。

      被问到昨晚在哪儿时你会说得很完整（几点走、几点到家、太太能证明），
      **而你会主动说"我给他发了消息"** —— 你说到第三条时会有一次停顿。

      你不会做的事：不会替自己说"我完全没理由"。不会指控邵川（你们不熟）。

  - id: p1
    name: 吴敏
    player: ai
    public: HR 总监。
    now: 上个月处理过一起投诉，被韩松要求压下来别上报。
    private: |
      你昨晚十点二十就上来了，因为你要送两个客户走。前台的登记上是你签的字。

      你在 12 层待到十一点，主要是给年会拍照的人在收器材，你得盯着。

      十一点你下楼，坐电梯走的，电梯里有监控。
    secret: |
      上个月有个实习生投诉一个组长，材料你收着，韩松让你别上报，理由写的是「证据不足」。

      你知道那份材料不算不足。你把它锁在抽屉里。

      韩松死后，你最怕的不是被抓——是那份材料被翻出来，**而上面有你的批注。
      你的批注写的是"建议按流程走"** ——你当时是站她那边的，可那句话说得很轻。
    knows:
      - 你昨晚 22:20 上 12 层，23:00 坐电梯下楼
      - 前台登记上有你的签字
      - 你送走了两个客户
      - 上个月那份投诉材料在你抽屉里，韩松让你别上报
      - 你在材料上写的批注是「建议按流程走」
      - 邵川上周被韩松驳回上线，你们在会前聊过两句
    goals:
      - 让那份材料以正确的方式被处理
      - 别让人觉得你为了保住位置做了什么
    culprit: false
    play: |
      你是 HR，说话有分寸、爱用"从流程上讲"。你回答时会先确认对方问的是哪一件事。

      被问到那份材料时你会停顿，然后说"那件事我在处理" ——**而你不会说韩松让你压下来**，
      除非被直接问（那时你会承认，并强调你写了批注）。

      你不会做的事：不会哭。不会主动说任何人的私事。

  - id: p2
    name: 邵川
    player: ai
    public: 后端组长。上周韩松驳回了他的上线申请。
    now: 手上那条线要接韩松的模块，下周三客户验收。
    private: |
      你昨晚**没去年会**。你下午在部门群里说「我今晚不去」，然后一个人留在 12 层改东西。

      22:41 你刷卡上了楼。你走的是消防通道——因为前台那个姑娘会问你去干嘛。

      22:47 你在 12 层打了一份东西，11 页。

      23:05 你从消防通道下去，直接从地下车库走的。

      你到家 23:40。
    secret: |
      你改的那份东西是**压测的原始数据**。

      上周那轮压测的真实结果是：并发到 800 就崩，而报给客户的是"2000 无压力"。
      那是韩松拍的板——他说先报上去，等验收过了再优化。

      你不同意，可你签了字。

      你昨晚是在销毁你自己手上那份原始记录。你怕验收出事之后，签字的那个人是你。
    knows:
      - 你昨晚没去年会，在部门群里说过
      - 你 22:41 刷卡上 12 层，走的消防通道
      - 你 22:47 打了一份 11 页的东西，23:05 从消防通道下去
      - 真实压测结果：并发 800 崩；报给客户的是 2000 无压力
      - 那份报告是韩松拍的板，而签字的是你
      - 谭立那边在等这个验收结果
    goals:
      - 别让人知道你昨晚在楼上
      - 别让人把那份压测数据翻出来
    culprit: true
    play: |
      你是做后端的人，说话讲因果、爱加限定条件（"严格来说"、"这个要看场景"）。

      被问到昨晚时你会说"我没去" ——**那句话本身是真的**（你没去年会），
      而你会希望对方就此打住。

      被问到 22:41 那条门禁时你会先说"我上去拿了个东西"，然后补一句"待了十分钟就走了"。
      **而你会把 22:47 那份打印说成"私人的东西"**，并且立刻换话题。

      你不会做的事：不会哭。不会说韩松的坏话（他确实保过你）。不会主动提压测。

  - id: p3
    name: 谭立
    player: ai
    public: 销售总监。手上一个大项目等着技术那边验收。
    now: 那个项目的合同是他签的，逾期的罚则写得很硬。
    private: |
      你昨晚在场，一直在应酬客户，喝了不少。

      十一点半你上了 12 层，想找韩松谈那个项目的事——他不在。

      你在开放工位区站了一会儿（你记得那里很暗），然后下楼，叫了代驾回家。
      代驾的记录在你手机上。
    secret: |
      你在客户那边承诺过一个你做不到的时间点——比实际能交付的早了一个月。

      那个项目如果逾期，罚则走的是你个人签的那条。你上周跟韩松吵过一次，
      他说「你自己答应的，你自己去改」。

      你上周五已经自己垫了八万进去，堵了客户那边的第一笔。
    knows:
      - 你昨晚 23:30 上了 12 层，找韩松，人不在
      - 你在开放工位区站过一会儿，当时那里很暗
      - 你叫了代驾，记录在手机上
      - 你上周跟韩松为那个项目吵过
      - 你个人垫了八万
      - 邵川那组要接这个项目的技术验收
    goals:
      - 让项目照常往下走
      - 别让人知道那八万和那个提前一个月的时间点
    culprit: false
    play: |
      你是销售，会说话、会把气氛托住。你会主动提供细节（几点、跟谁、喝了多少），
      而**细节太多会让你显得刻意**。

      被问到 23:30 上楼时你会说"我想找他聊项目" ——**而你会补一句"他不在"**，
      补得很快。

      你不会做的事：不会提那八万。不会说"我跟他关系挺好的"。

truth:
  culprit: p2
  accident: true
  narrative: |
    上周那轮压测，真实结果是并发到 800 就崩。而报给客户的是「2000 无压力」。

    那是韩松拍的板：先报上去，等验收过了再优化。邵川不同意，可他签了字——
    签字的那一栏是他。

    下周三客户验收。邵川手上那份原始记录是唯一能证明"从一开始就是假的"的东西。
    他昨晚是上去销毁它的。

    22:41 他从消防通道上楼，没走前台。22:47 他在 12 层打印了那 11 页原始数据，
    打算碎掉再带走纸屑。

    那时候韩松在开放工位区——他一个人坐在那儿，没开大灯。

    他看见了邵川。他叫住了他。

    两个人吵起来。韩松的意思是：验收过了就没事，你现在销毁记录，出事的时候谁都保不住你。
    而邵川说了一句「那我签的字怎么办」。

    推搡里韩松往后倒，后脑撞在工位隔断的金属包边上。

    邵川扶了他一下，然后发现他还在呼吸——**而他站在那里，先把手里的那 11 页塞进了碎纸机**。

    碎完之后他才下楼。22:05 之前他在楼上待的每一分钟，都有门禁和打印机的记录。

    地下车库的出口没有登记。他 23:40 到家。
  timeline:
    - at: "22:00-22:20"
      who: p0
      doing: "郑野在年会上被韩松当众换了模块，22:20 离开宴会厅打车回家"
      witness: ["同桌的人", "打车记录"]
    - at: "22:20"
      who: p1
      doing: "吴敏上 12 层送客户，前台登记上有她的签字"
      witness: ["前台登记"]
    - at: "22:41"
      who: p2
      doing: "邵川从消防通道刷卡上 12 层（他没去年会，下午在群里说过不去）"
      witness: ["12 层门禁记录"]
    - at: "22:47"
      who: p2
      doing: "邵川在 12 层打印压测原始数据，11 页"
      witness: ["打印机记录（12 层 IP）"]
    - at: "22:50"
      who: p0
      doing: "郑野到家，太太还醒着"
      witness: ["p0 的太太"]
    - at: "23:00 前后"
      who: p1
      doing: "吴敏坐电梯下楼（电梯有监控）"
      witness: ["电梯监控"]
    - at: "23:00-23:05"
      who: p2
      doing: "韩松在开放工位区叫住邵川，两人争执；韩松往后倒，后脑撞在隔断金属包边上"
      witness: []
    - at: "23:05"
      who: p2
      doing: "邵川把 11 页塞进碎纸机，然后从消防通道下楼，走地下车库"
      witness: ["碎纸机纸篓", "消防通道里掉落的工牌挂绳"]
    - at: "23:30"
      who: p3
      doing: "谭立上 12 层找韩松谈项目，人不在，站了一会儿后下楼叫代驾"
      witness: ["代驾记录"]
    - at: "23:40"
      who: p2
      doing: "邵川到家"
      witness: []
  key_facts:
    - "12 层门禁：22:41 邵川刷卡进入（而他下午在群里说过今晚不去）"
    - "12 层打印机：22:47 打印 11 页，来源是 12 层内网 IP"
    - "他的工牌挂绳掉在消防通道 —— 他走的是楼梯，不是前台那条路"
    - "碎纸机的纸篓里有一角没碎干净的纸，上面是压测的原始并发数"
    - "真实压测结果 800 崩，报给客户的是 2000 无压力；签字的是邵川"
    - "郑野那个模块被换人，是因为模块的同名内部代号与邵川接的那条线重了 —— 韩松是在把他摘出去"
  misdirections:
    - "郑野（玩家自己）：他在年会上被当众换了模块、还发过消息，而他删了一半的草稿看起来像「我为了这件事找过他」。他没上楼，这条可以靠打车记录和太太洗掉。"
    - "吴敏：她 22:20 到 23:00 在 12 层，而且她抽屉里有一份被压下来的投诉材料 —— 那是她的负担，而它跟昨晚无关。"
    - "谭立：他 23:30 上过楼、跟韩松吵过架、还个人垫了八万 —— 他上楼的时候人已经倒下了，而他瞒的是那八万。"
  after:
    - "验收照常进行。客户在第三轮压测时发现了问题，项目停了四个月"
    - "吴敏把那份投诉材料重新交了上去，走的是流程 —— 她后来因为这件事被调岗"
    - "谭立那八万一直没要回来。他第二年离职了"

clues:
  - id: c1
    title: 12 层的门禁记录
    text: |
      行政导出的门禁记录（年会当晚，12 层）

      22:20  吴敏        正门
      22:41  邵川        消防通道
      23:00  吴敏        电梯下行
      23:05  邵川        消防通道（下行）
      23:30  谭立        正门
      23:52  谭立        电梯下行
    supports: "邵川 22:41 走的是消防通道 —— 那说明他不想经过前台。而他下午在部门群里说过「我今晚不去」。门禁是刷卡的，卡能借；但这条记录与另外两条（c2 与 c3）合起来就把「借卡」这条路堵死了。"
  - id: c2
    title: 打印机的任务记录
    text: |
      12 层打印机 · 任务日志

      22:47  页数 11  来源 10.20.12.37（12 层工位网段）  提交人：未登录（本机直连）
      22:47  页数 11  状态：已完成
    supports: "22:47 有人从 12 层的工位网段直接打了 11 页。结合 c1，那时在楼上的只有邵川。而「未登录、本机直连」说明是走到打印机跟前接的 USB。"
  - id: c3
    title: 消防通道里的东西
    text: |
      12 层消防通道 · 现场（次日早晨）

      楼梯转角地面上：一根深蓝色的工牌挂绳，带卡套，**卡不在里面**。
      挂绳末端有撕裂痕迹，是拉断的。

      同一次巡检：碎纸机纸篓里翻出一角没碎干净的纸，边缘露出半行数字：
        「并发 800 持续 90s → 失败」
    supports: "挂绳是拉断的 —— 那是争执里扯下来的，而卡被人捡走了。纸角上那半行是压测的原始结果：并发 800 就失败。而报给客户的报告写的是 2000 无压力。"
  - id: c4
    title: 那份报给客户的报告
    text: |
      项目验收材料（下周三待交）

      压测章节：单机 2000 并发，无压力，响应均值 82ms
      编制：邵川
      审核：韩松
    supports: "签字的是邵川，拍板的是韩松。所以销毁原始记录这件事，邵川有动机——而韩松也有理由拦他。"
  - id: c5
    title: 群里那条消息
    text: |
      部门群 · 年会当天 17:12

      邵川：「我今晚不去，手上有点事。」

      同一时段，行政的座位表上，第二桌有他的名字。
    supports: "他公开说过不去，而 22:41 又上了楼 —— 这一条是矛盾，而矛盾本身不是罪。它只是让 c1 那条记录变得需要解释。"

emotional:
  - setup: "韩松在年会上那句「换人」，是他把郑野从一个要爆的模块上摘出去 —— 而郑野整晚都在想「我哪做得不对」"
    channel: "交接单还没下来这件事本身；以及模块内部代号与邵川那条线重了"
    reveal_at: reveal
