clues:
  - id: c1
    title: 吊杆控制台的日志
    text: |
      12 号（昨晚）· 长风剧场后台控制系统 · 操作日志

      21:47  三号杆  状态查询        admin_sy
      22:00  三号杆  限位调整 (+3)   admin_sy
      22:00  三号杆  状态：完成
      22:31  总闸    断电           admin_wb
    supports: "22:00 有一次限位调整，用的是 `admin_sy`——沈砚的账号。而 22:00 沈砚在台上谢幕。全团只有两个人是管理员（沈砚、武斌），所以这一条要么是他自己用的，要么是别人用了它。**先别急着下结论**：谁用过那个账号，系统不记。"
  - id: c2
    title: 高台边上那截护栏
    text: |
      后台高台 · 现场照（次日凌晨）
      高台高 2.3 米，边上有一截活动护栏，长 1.6 米。

      护栏**只脱开了一头**，另一头的两颗螺丝还在孔里，螺帽朝上。
      脱开那一头的插销孔里没有断裂痕迹——是抽出来的，不是撞断的。
      护栏内侧靠地那一段有一处新鲜的漆痕，约 8 厘米，方向朝内。

      同一次勘察：高台侧面的工具箱开着，里面少一把六角扳手。
      那把扳手第二天在高台下面找到了。
    supports: "**这是本子里的硬证据。**「只脱开一头、另一头螺丝还在」是**拆开**的样子，不是撞开的——撞的话两头会一起受力。插销孔里没有断裂痕迹，说明它不是被撞出去的，是被抽出来的。而工具箱开着、少一把六角扳手、那把扳手就在台下——**有人在高台上动过手，而那是在坠落之前**。"
  - id: c3
    title: 三号杆的报修单
    text: |
      长风剧场 · 后台设备报修单（12 号）

      时间：12 号 15:40
      项目：三号吊杆配重卡滞，行程不畅
      报修人：沈砚
      处理：待处理

      备注（武斌手写）：让小于明天上午看，今天要首演，杆先别动。
    supports: "那条杆当天下午就出过问题，而沈砚自己报了修。**武斌在备注里写了「杆先别动」** —— 所以 22:00 那次限位调整，是谁改的主意？这一条同时说明：沈砚那天下午对那根杆是上心的，而他上心到会自己动手。"
  - id: c4
    title: 侧幕三个人的证词
    text: |
      问询摘录（次日）

      灯光师老戴：何晏？他一直在侧幕啊，21:50 到 22:15，我就在他旁边。收景片的时候他还帮我递了一根线。
      道具小于：对，他在。他 22:15 才走，往楼上去了。
      演员（最后一段）四人：我们下来的时候他还在侧幕站着，穿着那件灰外套。
    supports: "三个独立来源把何晏的 21:50–22:15 钉在侧幕——而他 22:15 上了二楼。**这条同时替武斌的说法挖了坑**：武斌说他 22:00 在侧幕收景片，而侧幕那三个人那一晚从头到尾没提过他。"
  - id: c5
    title: 那张被涂掉一行的条子
    text: |
      物证：何晏交出的便条（沈砚手写）

      「第三场你从左侧上，走到楼梯口停半拍——
       那里灯要压三秒，你等它。
       ————
       」

      最后一行被涂掉了，涂掉的部分三厘米长。
      涂改用的笔与上面字迹的墨色不同：上面是黑墨水，涂的是蓝圆珠笔。
    supports: "涂改的笔不是沈砚的。**这一条不指向凶手**，它指向的是「有人在沈砚写完这张条子之后动过它」——而那个动作发生在什么时候，这张纸说不出来。它是这个本子里唯一一条**看起来很像关键、而其实只说明有人碰过它的物证**。"

emotional:
  beat: |
    这个本子最难受的地方不在"谁推了他"，而在**六个人各自都瞒了一件事，
    而那六件事里没有一件是杀人**。苏晚是唯一一个在他还活着的时候到过他身边的人，
    而她什么也没说——她跑下楼，然后跟着别人一起等着别人发现。
  object: "沈砚那把六角扳手"
  object_text: |
    那把扳手是从台下找到的。
    按说它该在工具箱里——沈砚从来是干完活就收工具的人，三十年都这样。
    工具箱里少它，说明他当时还在弄，还没收。
    而它掉在台下：说明他松手了。
  prompt: "如果昨晚你在 21:38 开了口，会怎么样？"
  closing: "这不是一个「谁是坏人」的局。这是一个「每个人都在那一刻选择了不说」的局。"

phases:
  - id: self-intro
    name: 自述
    rule: "每个玩家从「我昨晚在哪儿」开始说，主持人一个个请他们上桌"
  - id: inquiry
    name: 问话
    rule: "玩家可自由向任何人提问，无轮次上限；DM 可以提示『该搜证了』但不给暗示"
  - id: search
    name: 搜证
    rule: "一次性给出五条线索，不因为谁被怀疑而增减"
  - id: final
    name: 发言投票
    rule: "每人说一次『我怀疑谁、为什么』，然后投票"
  - id: reveal
    name: 复盘
    rule: "公布真相：那截护栏是怎么脱的、22:00 那一杆动了什么、以及六个人各自瞒了什么"

briefing:
  opening: |
    长风剧场，后台。昨晚首演散了场，22:25 场务上去锁门的时候发现了他。
    现在这个房间里坐着六个人，而昨晚在后台待过的，就是这六个。
  tone: "别急着问「谁推了他」——先弄清楚那截护栏是怎么脱开的。"
  pace: "六个人比四个人慢，那是正常的：四个人的时候一问一答就够，六个人的时候每一条时间线都要对三遍。别催。"
  notes:
    - "这个本子的核心不是动机，是**那条日志上的账号**。谁都在瞒点什么，而只有一个人在时间上说了谎。"
    - "苏晚那条线要让它自己浮出来——她是桌上最像凶手的人，而她说出 21:38 那一刻的时候，这个局才真正打开。"

style:
  register: "舞台后台的行话可以有（杆、景片、侧幕、换场），但别堆。玩家不懂那些词也能玩。"
  avoid: "不要写成刑侦报告。「他是被谋杀的」这句话在本子里不成立——那正是这个本子的题眼。"

audit:
  questions:
    - "如果你昨晚在 21:38 开了口，会怎么样？"
    - "这个人死了，而你有没有在某一刻松一口气？"
    - "你瞒的那件事，说出来之后你失去了什么？"
  authority: "只报告，不结论。判『越界』的输入是 roles[*].knows——他说出那里没有的东西，就是越界。特别注意谁说得出 22:00 那条日志，以及谁在回避「高台」这两个字。"
  reveal_questions:
    - "那条日志上的账号，你为什么一开始不说？"
    - "你上去的时候，护栏是好的还是坏的？"
  closing:
    - "每人的秘密各说一遍"

reveal:
  steps:
    - "把三样东西摆在一起：护栏只脱开一头、插销孔里没有断裂痕、工具箱开着少一把扳手"
    - "接着问：22:00 那条限位调整，是谁用的那个账号"
    - "最后才是：他为什么一个人在高台上弄那截护栏"
  questions:
    - "有没有哪个 AI 玩家的话真的影响了你的判断？"
    - "有没有哪一刻你特别想追问某个人？"
    - "这次有没有『咯噔一下』？"

world_facts:
  - "长风剧场后台有两层：一层是化妆间、茶水间、道具间；二层是办公室与控制室，控制室窗户正对高台"
  - "吊杆靠舞台侧面的钢丝与配重升降，控制台在二楼；三号杆挂的是最后一幕那块大景片"
  - "后台控制系统按账号记操作日志，但**不记操作时人在不在机器旁边**"
  - "高台是收景片用的，边上有一截活动护栏，可以拆下来（拆一头就能抽开）"
  - "侧门有门禁，正门门厅夜里由值班员看着；后台与观众席之间有隔音门"
  - "首演当晚座四百人，散场 21:40，观众从正门离场"

liberty_to_slip:
  - "p1 周迟：你会主动说 22:05 从正门出来、值班员看见你了；被问到身体时你会说「老毛病」；你不会主动提退的事，而被直接问到时你会承认一半（「在考虑」），不承认另一半（体检报告）"
  - "p2 林一孜：你会先说你 22:10 回后台拿东西，被追问才说是原稿；你会抓住别人的用词不放；你不会主动提那封邮件，而被问到上周的争执时你会绕"
  - "p3 武斌：你会承认 22:00 在控制室，而**不会主动说用的是沈砚的账号**——那要等别人拿日志来问；被问到账号时你会先说「那套系统老」，再说「大家都是那么用的」；你会露一处破绽：你对那截护栏知道得太多（哪年装的、螺丝多大）"
  - "p4 何晏：你会把侧幕那段时间说得特别细（那三个人名你会主动报出来）；被问到条子你会先否认，被追问两次才说「我可以给你们看」；被问到那行涂掉的字，你会说「我不知道是谁涂的」——那是真的"
  - "p5 苏晚：你会先给一个干净的说法，被追问细节才开始补时间；你会在「21:38」上卡一下；你不会主动说 22:20 摸过他，而那件事只有在别人逼到「你到底什么时候上去的」时才会漏出来"

