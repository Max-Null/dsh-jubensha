clues:
  - id: c1
    title: 金库的时间锁
    text: |
      铜带（时间锁的记录，英国造，一昼夜一卷）

      十一月十七日
        08:12  开
        11:40  关
        13:55  开
        17:20  关
        23:0 ██████████  ← 此处缺一段，切口很齐，铜色是新的

      背面用铅笔写着一行小字，是陆敬之的笔迹：
        「不是她的。」
    supports: "缺的那一段就是 23:00 前后的开门记录 —— 有人从时间锁上扯掉了它。而背面那行字是陆敬之自己写的：他扯下来的时候已经知道要出事，而他要护的是「她」。这两件事合起来说明：扯铜带的不是凶手，是死者。"
  - id: c2
    title: 后门铜匠铺
    text: |
      巡捕房笔录 · 十一月十八日

      【铜匠铺掌柜】
      「昨夜里十点四十前后，有位小姐来取钥匙。是十六号送来配的，定金五个铜板。」
      「什么钥匙？就一把小铜钥匙，这么长（比出三四寸）。齿是七道，前四道密，后三道疏。」
      「她催得紧，我连夜做的。」

      【搜查记录 · 沈曼卿住处】
      亭子间五斗柜最下一格，起出铜钥匙一把。齿七道，前四密后三疏。
      同格另有一张十一月初的旧照片，背面写着两个字：「凭据」。
    supports: "两件事：① 那七道齿、前四密后三疏的齿形 —— 锁匠可验，与金库那把是同齿。而这把钥匙**不是行里的公私钥，行里没有第三把**；② 她十六号就送配，说明早就准备了，而她对外只说是房门钥匙。**这一段是判断**：钥匙在她房里起出来，而金库里的东西少了一样 —— 两件事要凑在一起才成链。"
  - id: c3
    title: 账房间的最后一次交班
    text: |
      程守仁的钥匙串（在他身上，未丢）

      陆敬之身上的钥匙串（在夹袄内袋里，两把，其中一把是金库的）

      金库门锁：一个孔，两把钥匙齿形相同，都插进去才转得动
    supports: "两把真的都在原处。而锁是同一个孔、两把同齿 —— 所以昨晚开过它的人手里有一把**配的**（见 c2）。这不是「他用钥匙开的」，也不是「谁把钥匙借出去了」：两把都在死者身上，能开门的第三把只能是复制的。"
  - id: c4
    title: 那本内账
    text: |
      金库内 · 第三格（巡捕清点的记录）

      银元、公债票、地契，都在。
      **只有一样东西缺：本行的内账册（牛皮封面，红格）。**

      内账册的最后一次登记：本年九月，由襄理陆敬之本人登记。
    supports: "杀人之后没拿钱、没拿公债，只拿了一本账 —— 那说明凶手要的是账里记的东西，不是钱。而能看懂这本账的人不多。"
  - id: c5
    title: 后楼梯的第三级
    text: |
      后楼梯 · 现场（十一月十八日早晨）

      灯坏了半个月，摸黑走。
      第三级有响声，踩上去会响，木缝里卡着一粒黄铜屑。
    supports: "黄铜屑从铜匠铺那条路上带回来的可能性最大 —— 配钥匙要锉，锉下来的铜屑会挂在袖口、鞋底。而阿六当晚也走过这条楼梯，所以这一条只能佐证，不能定人。"

emotional:
  - setup: "陆敬之扯下那一段铜带，是想替沈曼卿遮住她开过库这件事 —— 而她要的那笔钱，恰恰是自己父亲存在他手里的"
    channel: "铜带背面那行铅笔字，以及那本被拿走的账"
    reveal_at: reveal
    object: "一卷缺了一段的铜带，背面有四个铅笔字"

phases:
  - id: self-intro
    name: 自述
    rule: "每个玩家说出自己昨晚的经历；AI 玩家由 DM 单独引导，逐个上桌"
  - id: inquiry
    name: 问话
    rule: "玩家可自由向任何人提问，无轮次上限；DM 可以提示『该搜证了』但不给暗示"
  - id: search
    name: 搜证
    rule: "一次性给出五条线索，不因为谁被怀疑而增减"
  - id: final
    name: 发言与投票
    rule: "每人说一次『我怀疑谁、为什么』，玩家最后投票"
  - id: reveal
    name: 复盘
    rule: "真相时间线 + 每人的秘密 + 情感线收拢 + 三个验收问题"

briefing:
  steps:
    - at: "自述"
      detail: "每个玩家说自己昨晚的经历。AI 玩家逐个上桌，一人一段。"
    - at: "问话"
      detail: "自由提问，无轮次上限。你只维持桌面，不替任何人推理。"
    - at: "搜证"
      detail: "一次性给出五条线索。给出后不再增减，谁被怀疑都一样。"
    - at: "发言与投票"
      detail: "每人说一次『我怀疑谁、为什么』，玩家最后投票。你把票型记下来。"
    - at: "复盘"
      detail: "真相时间线 + 每人的秘密 + 情感线收拢 + 三个验收问题。"
  limits:
    - "不给暗示——玩家卡住时只能复述他已经知道的事实"
    - "不加线索——五条就是五条，不因为谁被怀疑而增减"
    - "不替玩家推理——谁的话跟谁的话撞了，那是玩家自己的活"
    - "抄原话时一个字不改，哪怕那句话本身看着不对劲"
    - "这个本子是民国二十三年的上海，用词也是那个年代的——不要在对话里冒出后来的说法"

style:
  lines:
    - "我不晓得。"
    - "第三级会响，你晓得的。"
    - "你那张纸，经不起看。"
    - "账上的事，一码归一码。"

audit:
  focus:
    - "与角色本不符——某人说了自己不可能知道的事"
    - "前后矛盾——同一件事两轮里说得不一样"
    - "时间线对不上——某人的说法与铜带、门房或真值时间线冲突"
  authority: "只报告，不结论。判『越界』的输入是 roles[*].knows——他说出那里没有的东西，就是越界。特别注意谁提到「后门」「铜匠」「配钥匙」，以及谁在回避这几个词。"

reveal:
  steps:
    - "把真相时间线按顺序说一遍（一段一个人）"
    - "把铜带翻过来给玩家看：那四个铅笔字是他写的，而他要护的人动了手"
    - "解释三个『其实不是』：程守仁那十分钟的含糊是真的（灯坏了，没人看见他）；阿六瞒的是一块银元；陆敬安敲过门，而门锁着"
    - "把那把配的钥匙与铜匠的证词摆在一起——七道齿，前四密后三疏"
    - "每人的秘密各说一遍"
  questions:
    - "有没有哪个 AI 玩家的话真的影响了你的判断？"
    - "有没有哪一刻你特别想追问某个人？"
    - "这次有没有『咯噔一下』？"

world_facts:
  - "民国二十三年，上海，通和银行是家华资小行，做的是街坊生意"
  - "金库门是英国造的：两把钥匙**开同一个孔**，齿形相同，两把都插进去才转得动"
  - "行里的规矩是襄理与出纳主任各持一把、两人同时在场——**那是一条规矩，不是一道锁**：它防的是单人开库，防不了谁私配一把"
  - "时间锁的记录打在一条铜带上，一昼夜一卷；铜带可以扯，但扯过的切口看得出来（铜色新旧不一样）"
  - "行里的门房夜里守着，谁走正门进出都看得见；**后门入夜落锁，钥匙在门房手里**"
  - "后楼梯通向弄堂，灯坏了半个月，行里一直没修"
  - "后门出去左转那家铜匠铺，什么钥匙都配，不问来路"

