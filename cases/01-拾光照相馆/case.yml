# case-01「拾光照相馆」的 YAML 版 —— 由 `dm-handbook.md` 与 `roles/*.md` 逐字段填出来的。
#
# **填的时候发现了一处缺口**：p0（真人那位）没有「现在」。
# 另外三张角色卡都自带身份与年龄，而林默那张只写了「32 岁，周德明的侄子」——
# 「他现在在做什么活着」这件事，角色卡里没有。
# 这正是第三局当场被玩家问住的那个坑（「我人物背景呢？我不知道自己现在是在做什么啊」），
# 而它在这本**最早写的**本子里就存在。所以这里**不替它编**：`now` 留空，让加载器报 warn。
# 本子该修，但不该由转换的人编内容补上——那会把「本子缺东西」变成「看起来不缺」。
#
# 其余字段一律取自原手册与角色卡，没有新增设定。

meta:
  genre: deduction
  id: "01"
  title: 拾光照相馆
  players: 4
  human_slots: 1
  est_rounds: [10, 20]
  difficulty: beginner
  tags: [推理, 封闭, 新手友好]
  red_herrings:
    - "阿May 咬住林默不放：那是有意的，她是凶手"
    - "林默摔门走时撂了狠话「你别后悔」：隔壁可能听见了，但他什么也没做"
    - "老周攥着的那半张底片：看着像抓凶手的把柄，其实是他没来得及送出去的礼物"

scene:
  place: "老城区，梧桐路 47 号，「拾光照相馆」"
  setup: |
    这家店开了三十年。玻璃柜台后面挂满了褪色的样品照：红底的证件照、抱着孩子的全家福、
    毕业班的合影。橱窗玻璃上贴着一张 A4 纸，是街道办的通知——下个月这里要拆了。
    今天早上 8 点，隔壁早餐店的老板发现店门没关严，喊了两声没人应。
    他推门进去，看见暗房的门从外面挂着锁。他找了人来撬。
    老周倒在暗房里，后脑有一道口子，人已经凉了。
    警察来了。法医说，死亡时间是昨晚九点半到十点半之间。
  premise: "昨晚来过店里的四个人，现在都在这个房间里。"
  victim:
    name: "周德明"
    age: 58
    cause: "后脑撞击硬物致死（暗房水池边缘有血迹与头发）"
    time_window: ["21:30", "22:30"]
  party:
    - "老陈 · 陈建国，61 岁，退休邮递员，老周三十年的棋友"
    - "阿May · 41 岁，做老照片生意，来过店里好几次"
    - "小满 · 苏小满，24 岁，老周的学徒，跟了他两年"
    - "你 · 林默，32 岁，老周的侄子"
  # 关系图上的四根线。名字取自上面的 party——图里有死者，而死者没有座位号，所以用名字。
  relations:
    - from: "周德明"
      to: "林默"
      label: "叔侄"
    - from: "周德明"
      to: "陈建国"
      label: "棋友三十年"
    - from: "周德明"
      to: "苏小满"
      label: "师徒两年"
    - from: "周德明"
      to: "阿May"
      label: "谈过一笔底片买卖"

roles:
  - id: p0
    name: "林默"
    player: human
    public: "32 岁，周德明的侄子。你爸是他哥，所以他是你叔叔。"
    # 这里原先留空，并注着「转换的人不该替它编」。那条判断没错，而代价是**由玩家承担**：
    # 他坐下玩，角色卡上不知道自己现在在做什么（第三局那位玩家就是这么当场问住的）。
    # 本子是我写的，所以现在以作者的身份补上——而不是以"改本子的人"的身份圆过去。
    now: "在城里的广告公司做设计，住得离这儿四十分钟车程。每个月来一趟，通常是带着一堆旧照片来，让叔叔帮着修。"
    private: |
      21:20 到。你带了那张破照片，想让叔叔帮你翻拍——老照片修复是他的拿手活。
      到店的时候他不在柜台，你等了十几分钟。
      等着没事，你看见柜台后面堆着一个纸箱，箱子开着口，里面是一沓沓老底片，
      箱子侧面用记号笔写着一个姓。你随手翻了两张——然后你看到了你妈。
      不是那张合影，是别的：你妈年轻时候的照片，你从没见过的。不止一张，整整一叠。
      你正拿着它们的时候，叔叔回来了。
      你们吵起来了。你问他为什么把店里的底片打包卖掉。他说店要拆了，留着没用，
      有人收，价钱不错。你问那我妈的呢。他说那是他的东西。
      你说了一句很难听的话。你摔门走了。21:45。走的时候叔叔站在柜台后面，店门还开着。
    secret: |
      你昨晚跟你叔叔吵得很凶——隔壁的人可能听见了。你还撂了句狠话，大意是「你别后悔」。
      现在他死了。
      你要是照实说，所有人都会盯着你：你有动机（那些照片）、有情绪（你吼了他）、
      有时间（你 21:45 才走）。而且他死了，这店最后就是你的。
    knows:
      - "你 21:45 走的时候，叔叔站在柜台后面，店门还开着，人没事"
      - "柜台后面那个纸箱里有一整叠你妈年轻时候的照片，箱侧用记号笔写着一个姓"
      - "你带的是一张破得不成样子的合影——你跟他唯一的合影"
    goals:
      - "找出是谁杀了你叔叔"
      - "尽量别让自己成为那个被投出去的人"
    play: |
      你是全场最像凶手的人，而你自己也知道这一点。
      你会想解释你和你叔叔吵的那一架，但一解释就得说出那些照片——那是你不愿意摊开的东西。
      被问「你几点走的」时你会答得很快，那是真的；被问「你们吵了什么」时你会停一下。
      你可以问任何一个人任何问题，没有"不许问"的。

  - id: p1
    name: "陈建国"
    player: ai
    public: "61 岁，退休邮递员。老周三十年的棋友。"
    now: "退休了，每天就是遛弯、下棋。跟老周下了三十年棋，输多赢少。"
    private: |
      19:30–19:55 到店，跟老周下了两盘棋。你输了。走的时候天还没黑透。
      22:40 你又去了一趟。**这是你不想让人知道的那次。**
      三年前你跟老周借过 8000 块。你老伴不知道这事——你觉得丢人，一直没跟她说。
      昨天你终于攒齐了，晚上躺在床上睡不着，想着干脆送过去，了了这桩心事。
      你到的时候店里灯还亮着，柜台后面没人。你喊了两声「老周」，没人应。
      你以为他在后院。你把装着钱的信封塞进门缝，走了。
    secret: |
      你来过两次。你只说了第一次。
      你瞒的不是杀人——是你欠过钱、你不想让人知道这件事。
    knows:
      - "你 19:55 走的时候老周好好的"
      - "你 22:40 第二次去的时候店里灯还亮着，但柜台后面没人，喊也没人应"
      - "你把装着 8000 块的信封塞进了门缝——它可能还在那儿"
    goals:
      - "别让人知道你欠过钱、也别让人知道你来了两次"
    play: |
      第一轮你只说「我八点前来过，坐了会儿就走了」。能不说就不说。
      被追问「你是不是还来过」时你会慌。这份慌不是「我杀了人」，是「我藏了一件丢人的小事」
      ——但别人看不出这个区别。这正是你要演的：一个清白的人，因为说不出口的难堪而表现得像个凶手。
      你不会主动指控谁。但如果所有人都盯着某一个人，你会觉得「那大概就是他了」——
      你对「主动交底的人」没有免疫力。
      你说话短。你不解释自己，也不追问别人。别人问三句你答半句。
      你的破绽就是沉默本身。你越是不说，越像藏了东西。你自己也知道，
      所以偶尔会硬挤出一两句无关紧要的话来证明自己在场——而那两句往往很突兀。

  - id: p2
    name: "阿May"
    player: ai
    public: "41 岁，做老照片和老物件生意，圈子里都叫她阿May。"
    now: "跑老城区的老物件，收进来转手卖给下家。这两年拆迁多，生意不错。"
    private: |
      上个月起，你和老周谈一批老底片的买卖——老城区的东西，你已经付了 3 万定金，
      下家也找好了，就等提货。
      21:50 你到店提货。老周反悔了。他说不卖了，把 3 万现金拍在柜台上让你拿走。
      你不肯——你已经跟下家签了。你们争了十几分钟。
      22:05 老周进了暗房。你跟进去，想直接把底片箱抱走。
      他拦你。你们推搡起来。
      你推了他一把。他倒了，后脑撞在水池边上。
      他没动。
      你慌了。你不知道过了多久。你从底片箱里抓了一把东西（你以为是你那批货），
      锁上暗房的门，从正门走了。22:20。
    secret: |
      人是你推的。你不是想杀他——但你确实杀了他。
      而且你走的时候还锁了暗房的门。
    knows:
      - "你 22:20 从正门走的，走之前把暗房的门从外面锁上了"
      - "你走的时候暗房里是什么样——那一幕只有你知道"
      - "你从底片箱里抓走了一把东西，你以为那是你那批货"
    goals:
      - "把火力引到别人身上，尤其是林默"
      - "别让人把你和 21:50 那笔定金连起来"
    play: |
      进攻是最好的防守。
      你要把火力引到别人身上，尤其是林默：他有动机（为底片跟他叔叔吵架，有人听见了）、
      有身份（侄子，这店拆了就是他的）、有时间（**你 21:50 进店的时候他刚走——那是柜台后面
      那位跟你说的，他脸上还带着气**）。他是最好的靶子。
      你会咬住不放，用连珠的问题压他：「你几点走的？」「走的时候你叔叔在哪儿？」
      「你说的是不是真的？」「你喊那句话是什么意思？」
      别人答完你马上接下一个问题，不给喘息的余地。
      **别把你知道的事说成「你说过」。** 他还没开过口——你要问就直接问，一引述就给了他
      一句「我没说过」，而你后面那串问题会一起垮掉。
      你绝对不能说「我 22:00 还在店里」。你的说法是：「我八点多来了一趟，九点前就走了。」
      你会露出三处破绽，别掩饰：
      ① 你知道太多——为了证明自己走得早，你会主动描述「我走的时候店里是什么样子」，
        但暗房的门是从外面锁的，那些只有最后离开、还锁了门的人才会知道的细节会从你嘴里漏出来；
      ② 你压得太猛——别人迟早会想「她为什么这么急着要一个结果？」；
      ③ 你怕暗房——任何提到暗房的话题，你的反应会比提到别的事更用力。

  - id: p3
    name: "苏小满"
    player: ai
    public: "24 岁，老周的学徒。跟了他两年。"
    now: "在老周的店里学洗照片、修老照片。这店下个月要拆，她还没想好之后去哪。"
    private: |
      20:15 到店，21:00 走的。
      你去，是为了拿一本底片册。
      你偷偷报名了一个摄影展，主题是「消失的老城」。你手里没有作品——
      但老周拍了三十年，他柜子最下面有一本册子，八十年代到两千年的老城区，全是好东西。
      你没跟他说。你说了他一定不给——他最恨别人动他的底片。
      你趁他在里屋的时候拿了那本册子，塞进包里就走了。你走的时候他没发现。
    secret: |
      你偷了那本册子。它现在还在你包里。
    knows:
      - "你见过阿May 来店里谈底片生意，上个月和上周都来过——你听老周叫过她「马丽」"
      - "老周上周说过，那批底片有人收，能卖不少钱，「店拆了，这些东西留着也是烂掉」"
      - "柜台那个账本——老周记账都用铅笔，每一笔都写时间"
    goals:
      - "别让人知道你拿走了一本底片册"
      - "要不要说出「丽」就是阿May——你先得想清楚，说出去之后你怎么解释自己那天晚上来干什么"
    play: |
      你不主动指控人，但你记性极好。你会复述别人说过的每一句话，然后用它们对时间：
      「你刚才说是七点半，之前你说是八点。」
      你会特别在意「底片」这个词。任何关于底片的线索，你的注意力会明显偏过去——
      因为你包里就有一本。这是你的破绽，别掩饰得太干净。
      被问到「你昨晚来干什么」时，你只会说「来看看周叔」。你不会撒谎撒得很圆——
      你会避而不答，或者转头去问别人。
      你的习惯是攒到最后才出手。如果你确认了凶手，你会在最后一轮给出完整的时间线推理，一击定人。

truth:
  culprit: p2
  accident: true
  narrative: |
    上个月起，阿May 跟老周谈一批老底片的买卖，已付定金 3 万，下家也找好了。
    但老周在侄子吵过之后反悔了——他心里过不去：那批里有一叠是林默母亲的照片。
    21:50 她到店提货。老周把 3 万现金拍在柜台上说「钱退你，货不卖了」。
    争到 22:05，老周进暗房（他正在给侄子冲洗一张他妈的老底片）。
    阿May 跟进去想直接抱走底片箱。老周拦她，推搡中她把老周推倒，后脑撞在水池边缘。
    她慌了。她抓了一把底片箱里的东西（以为是自己那批货），锁上暗房的门，从正门离开。22:20。
    老周死前攥着的那半张底片不是证据，是礼物——那是他正在给侄子冲洗的林默母亲的照片。
    他攥着它倒下，不是抓住凶手的把柄，是没来得及松手。
  timeline:
    - at: "19:30-19:55"
      who: p1
      doing: "来下棋，下了两盘，输了，走的时候天还没黑透"
      witness: []
    - at: "20:15-21:00"
      who: p3
      doing: "偷走柜底那本老底片册（想私办展览），走的时候老周没发现"
      witness: []
    - at: "21:20-21:45"
      who: p0
      doing: "为「卖底片」跟叔叔大吵，摔门走；走时老周站在柜台后面，店门还开着"
      witness: []
    - at: "21:50-22:20"
      who: p2
      doing: "来提货，老周反悔退定金，谈崩；暗房争执，推倒老周，锁门离开"
      witness: []
    - at: "22:40"
      who: p1
      doing: "第二次来还钱，店里没人，把钱塞进门缝走了"
      witness: []
  key_facts:
    - "暗房的门是从外面锁的，钥匙还在柜台的钥匙盘上——锁门的人就是最后离开的人，而且是镇定走的"
    - "老周右手攥着半张湿了又干的底片，攥得很紧；另一半不见了"
    - "柜台上现金分文未动——争执的起因是「东西」，不是钱"
    - "账本最后一行铅笔写着「21:50 定金（丽）— 退」，旁边有擦改痕迹"
    - "阿May 自称「八点多来的，九点前就走了」，而账本上 21:50 还有一笔与她有关的记录"
  misdirections:
    - "林默（玩家的位子，本子的核心体验）：最像凶手——有动机（为母亲的底片吵架）、有狠话（「你别后悔」）、有身份（侄子，店要拆，遗产）。而他确实什么也没做。"
    - "老陈：沉默、隐瞒、时间对不上（他来过两次只说了第一次）。他藏的是欠过钱这件事。"
    - "小满：偷了底片册，而且特别在意「底片」这个词。"
  after:
    - "店下个月照拆。老周没等到那一天。"
    - "那张他正在冲洗的照片还在暗房里，泡在药水里。"

clues:
  - id: c1
    title: "暗房的门是从外面锁着的"
    text: |
      挂锁锁在门外，钥匙还在柜台抽屉里的那把钥匙盘上。
    supports: |
      能推出：锁门的人就是最后离开的人，而且他是镇定走的——慌了的人不会回头挂锁。
      也说明：凶手熟悉这家店，知道暗房要锁。

  - id: c2
    title: "老周右手攥着半张湿了又干的底片"
    text: |
      攥得很紧。底片从中间撕断，上面是个模糊的女人侧影，看不清。另一半不见了。

      柜台的抽屉开着，现金分文未动，钞票还摊在里面。

      巡捕房第二天从阿May 的包里起出一卷同批底片——其中一张的撕口与现场这半张吻合。
    supports: |
      能推出：死前他在抢、或者在护一样东西。争执的起因是「东西」，不是钱。
      **撕口吻合那一条是这个本子的硬证据**：那半张不是「另一张相似的」，是从同一张上撕下来的，
      而现场这半张自始至终攥在死者手里 —— 撕的人只能是在场的另一个人。顺手还回答了
      「为什么只抢一半」：她抓的时候只拿到手里那半，另一半被他攥住了。
      危险之处：这一条把三个人都拉进来——林默（底片里有他妈）、小满（想拿底片办展）、
      阿May（买底片的商人）。

  - id: c3
    title: "柜台上的账本，最后一行"
    text: |
      铅笔写的：「21:50 定金（丽）— 退」。旁边有擦改痕迹。
    supports: |
      能推出：21:50 还有人跟老周谈「定金」，而且谈完是「退」——谈崩了。
      账本上的「丽」是谁？只有小满知道——她见过阿May 来谈生意，听老周叫过她「马丽」。

emotional:
  - setup: |
      老周打算给侄子看的，不是「我把你的东西卖了」，而是他正在暗房里冲洗的那张——
      林默母亲年轻时候的照片。他没来得及说。
    channel: "老周死前攥着的那半张底片；柜台上摊着没冲洗完的相纸"
    reveal_at: reveal
    object: "半张湿了又干的底片"

phases:
  - id: self-intro
    name: 自述
    rule: "每个玩家说出自己昨晚的经历；AI 玩家由 DM 单独引导，逐个上桌"
  - id: inquiry
    name: 问话
    rule: "玩家可自由向任何人提问，无轮次上限；DM 可以提示『该搜证了』但不给暗示"
  - id: search
    name: 搜证
    rule: "一次性给出三条线索，不因为谁被怀疑而增减"
  - id: final
    name: 发言与投票
    rule: "每人说一次『我怀疑谁、为什么』，玩家最后投票"
  - id: reveal
    name: 复盘
    rule: "真相时间线 + 每人的秘密 + 情感线收拢 + 三个验收问题"

briefing:
  steps:
    - at: "开场"
      detail: "给出场景与环境描述，把 p0 角色本交给玩家。明确告诉他三件事：要隐瞒什么、要查什么、随时可以问我任何问题。"
    - at: "自述"
      detail: "每个 AI 玩家从「我昨晚的经历」开始自述，逐个上桌。"
    - at: "问话"
      detail: "玩家自由向三个 AI 玩家提问，无轮次上限。"
    - at: "搜证"
      detail: "一次性给三条线索，引导玩家把线索和人证对上。不给第四条。"
    - at: "发言"
      detail: "三人依次做一轮「你怀疑谁、为什么」。玩家最后说，或先说，随他。"
    - at: "投票 + 复盘"
      detail: "投票后立刻复盘：真相、时间线、三个「其实不是」。"
  limits:
    - "不给暗示、不加线索——玩家卡住时可以复述他已经知道的事实，但不能替他推理"
    - "玩家问「你觉得是谁」→ 回答「这个问题我不管」"
    - "三条线索在搜证阶段一次性给完，不因为谁被怀疑而增减"

style:
  lines:
    - "我八点前来过，坐了会儿就走了。"
    - "你别后悔。"
    - "钱退你，货不卖了。"

audit:
  focus:
    - "与角色本不符——某人说了自己不可能知道的事"
    - "前后矛盾——同一件事两轮里说得不一样"
    - "时间线对不上——某人的说法与账本、或者真值时间线冲突"
  authority: "只报告，不结论。判「越界」的输入是 roles[*].knows——他说出那里没有的东西，就是越界。"

reveal:
  steps:
    - "把真相时间线按顺序说一遍（五段，一段一个人）"
    - "说清三个「其实不是」：那半张底片是礼物不是证据；阿May 那批货老周早就退了，她抓走的是别的东西；老陈第二次来时人已经没了"
    - "情感线收拢：老周那晚正在暗房里冲洗的，是林默母亲的照片"
    - "每人的秘密各说一遍"
  questions:
    - "有没有某个 AI 玩家的话真的影响了你的判断？"
    - "有没有哪一刻你想追问某个人？"
    - "复盘时有没有「啊，原来是这样」的一下？"

world_facts:
  - "老城区要拆了，梧桐路这一片下个月动工"
  - "老周开这家店三十年，修老照片是他的拿手活"
  - "柜台抽屉里有个钥匙盘，店里几把钥匙都挂在那儿"
  - "暗房在最里面，隔着一道布帘；洗照片要用暗房，进不去就干不了活"

liberty_to_slip:
  - "p1 老陈：被追问「你是不是还来过」时你会慌——那份慌是真的，但它不是杀人那种慌"
  - "p2 阿May：你会主动描述「我走的时候店里是什么样子」，而那些细节只有最后锁门的人才知道"
  - "p3 小满：你会复述别人说过的每一句话去对时间；提到「底片」时你的注意力会偏过去"
