scene:
  place: 民国二十三年冬，上海，通和银行二楼
  setup: |
    通和银行在宁波路上，一楼营业，二楼是账房间和后间——金库就在后间里。

    金库的门是英国造的：两把钥匙**开同一个孔**，两把都插进去才转得动。一把在襄理身上，
    一把在出纳主任身上——行里的规矩是两人同时在场。
    门上另有一台时间锁，几点开的、几点关的，会打在一条铜带上，卷在机器里。

    陆敬之，49 岁，本行襄理，昨夜死在金库门口。后脑被重物打过，凶器是金库门上那只铜把手。
