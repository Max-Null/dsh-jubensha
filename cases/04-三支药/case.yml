# 三支药 —— 一个封闭的医院推理本
#
# 设计时逐条对着 schema 的四条硬判据：
#   ① 收尾有一条物理上不可绕的证据 —— 自动柜的**指纹取药记录**与药房**门禁的刷卡进入**
#      必须配对（柜门开的那 12 秒里，药房门禁必须是"已进入"状态）。指纹不能借，而"进了药房"
#      不能否认。所以这个人**只能是他**，不是"他说谎"。
#   ② 误导负责制造情绪，不负责制造另一种真相 —— 李维的"删聊天记录"与郑宏的"晚上在楼里"
#      都是私事，客观上都不可能作案。玩家会怀疑他们，而那条路**走不通**（不是"另一条真相"）。
#   ③ 真人角色本的信息量 ≥ AI 角色本 —— p0 给了 now / private / secret / knows / goals / play
#      六段，与另外三份等量；世界事实也在 world_facts 里齐着。
#   ④ 出口修在动机的延长线上 —— p0 的动机是"他最后那句话要说什么"，所以出口就是"知道他要说
#      什么"，而不是"理解每个人然后放下"。
