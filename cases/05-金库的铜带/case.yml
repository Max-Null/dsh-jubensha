    private: |
      你昨晚十点四十从行里出去过一次，去后门那家铜匠铺取你配的钥匙。

      十点五十五你回来，从正门进去的，门房看见你了。

      **然后你上了二楼。** 十一点整，陆敬之正在锁金库——那扇门还开着，两把钥匙都插在孔里。
      你从侧后过去，用你配的那把，把门转开了。

      时间锁打了一行。他听见动静，进来看见那行记录，也看见了你手里那把钥匙。

      他没有喊人。他说：「曼卿，你父亲那笔账，我明天给你看。」

      你没有听。你从他背后动了手——用的是金库门上那只铜把手。

      你拿走的是那本内账，牛皮封面，红格。他的钥匙串你放回了他的夹袄内袋。

