    secret: |
      你爹三年前在这家行里存过四千两百块，是他一辈子攒的。他死后你去取，账上只剩三百。

      陆敬之给你看过一张单子，说那笔钱"当年买了公债，亏了"。

      你不信。而这三年你一直在找那张能证明他吃了钱的**内账**——就锁在金库里。

      你找铜匠配了一把钥匙。行里的规矩是两把钥匙分持两人、同时在场，**可那只是一条规矩**：
      两把钥匙开的是同一个孔，齿形一样，配一把就够。

      而昨晚你杀了他。你拿走账的时候他还倒在门边。

      **这件事你没有跟任何人说过，也不打算说。**
    knows:
