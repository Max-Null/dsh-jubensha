# 夜场 —— 六人剧团推理本
#
# **为什么写六人**：现有六本都是四人。而六人的价值不在人多，在**台前与后台是两条天然的对照线**
# ——谁在台上（观众看得见）、谁在侧幕、谁在后台，五个人的位置能互相咬合，而凶手必须在这张网里
# 找一个空档。四人时，一个人的不在场证明只能靠别人记不记得。
#
# 硬证据设计：**吊杆控制台的操作日志**。22:00 有一次限位调整，用的是沈砚的账号——而 22:00
# 沈砚在台上。所以那条记录钉住的不是"谁在现场"，而是"谁用了他的账号"：全团只有两个人知道那个
# 密码，另一个当晚在侧幕盯场（三个人能证明）。
